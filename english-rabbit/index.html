<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>词汇表（英语兔）分享版</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf7f0;
        --surface: #ffffff;
        --text: #1f2937;
        --dim: #78716c;
        --border: #e7e0d2;
        --accent: #0f766e;
        --red-bg: #fef2f2;
        --red-text: #b91c1c;
        --red-border: #fecaca;
        --green-bg: #f0fdf4;
        --green-text: #15803d;
        --green-border: #bbf7d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171512;
          --surface: #23201b;
          --text: #f0ede6;
          --dim: #a8a29e;
          --border: #3a352c;
          --accent: #2dd4bf;
          --red-bg: #450a0a;
          --red-text: #fca5a5;
          --red-border: #7f1d1d;
          --green-bg: #052e16;
          --green-text: #86efac;
          --green-border: #14532d;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; background: none; border: none; padding: 0; }
      button:disabled { cursor: not-allowed; }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .wrap { margin: 0 auto; width: 100%; max-width: 42rem; padding: 1rem 1rem 7rem; }
      @media (min-width: 1024px) { .wrap { max-width: 56rem; padding-left: 2rem; padding-right: 2rem; } }

      .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
      .topbar .count { font-size: 0.875rem; color: var(--dim); margin: 0; }
      .topbar .count strong { color: var(--text); }
      @media (min-width: 1024px) { .topbar .count { font-size: 1rem; } }
      .accent-row { display: flex; align-items: center; gap: 0.5rem; }
      .accent-row .lbl { font-size: 0.875rem; color: var(--dim); white-space: nowrap; }

      .switch { display: inline-flex; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 0.25rem; }
      .switch button { min-height: 2.25rem; white-space: nowrap; border-radius: 999px; padding: 0 1rem; font-size: 0.875rem; font-weight: 600; color: var(--dim); }
      .switch button.on { background: var(--text); color: var(--bg); }
      .switch.compact button { padding: 0 0.75rem; }

      .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 0.25rem; margin-bottom: 1.25rem; }
      .tabs button { min-height: 2.75rem; border-radius: 999px; font-size: 1rem; font-weight: 600; color: var(--dim); }
      .tabs button.on { background: var(--text); color: var(--bg); }
      @media (min-width: 1024px) { .tabs button { min-height: 3rem; font-size: 1.125rem; } }

      .card { border-radius: 1rem; border: 1px solid var(--border); background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      .intro { padding: 2.5rem 1.25rem; text-align: center; }
      @media (min-width: 1024px) { .intro { padding: 3rem 2.5rem; } }
      .intro h2 { margin: 0 0 0.5rem; font-size: 1.125rem; font-weight: 600; }
      @media (min-width: 640px) { .intro h2 { font-size: 1.25rem; } }
      @media (min-width: 1024px) { .intro h2 { font-size: 1.5rem; } }
      .intro .desc { margin: 0 auto 1.5rem; max-width: 28rem; font-size: 0.875rem; line-height: 1.7; color: var(--dim); }
      @media (min-width: 1024px) { .intro .desc { max-width: 36rem; font-size: 1rem; } }
      .btn-accent { min-height: 3rem; border-radius: 999px; background: var(--accent); padding: 0 2rem; font-size: 1rem; font-weight: 600; color: #fff; }
      @media (min-width: 1024px) { .btn-accent { min-height: 3.5rem; padding: 0 2.5rem; font-size: 1.125rem; } }
      @media (prefers-color-scheme: dark) { .btn-accent { color: #0b1512; } }
      .btn-dark { min-height: 3rem; border-radius: 999px; background: var(--text); padding: 0 2rem; font-size: 1rem; font-weight: 600; color: var(--bg); }
      @media (min-width: 1024px) { .btn-dark { min-height: 3.5rem; font-size: 1.125rem; } }

      .book-entry { display: flex; width: 100%; align-items: center; gap: 0.75rem; border-radius: 1rem; border: 1px solid var(--border); background: var(--surface); padding: 1rem; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      @media (min-width: 640px) { .book-entry { gap: 1rem; padding-left: 1.25rem; padding-right: 1.25rem; } }
      @media (min-width: 1024px) { .book-entry { padding: 1.25rem 1.5rem; } }
      .book-entry .ic { display: flex; height: 2.75rem; width: 2.75rem; flex-shrink: 0; align-items: center; justify-content: center; border-radius: 0.75rem; border: 1px solid var(--border); background: var(--bg); color: var(--accent); }
      @media (min-width: 1024px) { .book-entry .ic { height: 3.5rem; width: 3.5rem; } }
      .book-entry .ic svg { width: 1.5rem; height: 1.5rem; }
      .book-entry .tt { display: block; font-size: 1rem; font-weight: 600; }
      @media (min-width: 1024px) { .book-entry .tt { font-size: 1.25rem; } }
      .book-entry .ss { display: block; margin-top: 0.125rem; font-size: 0.875rem; color: var(--dim); }
      @media (min-width: 1024px) { .book-entry .ss { font-size: 1rem; } }
      .book-entry .chev { flex-shrink: 0; color: var(--dim); width: 1.25rem; height: 1.25rem; }
      .book-slot { margin: 1.5rem auto 0; max-width: 36rem; text-align: left; }
      .book-slot-below { margin-top: 1rem; }

      .backbar { display: flex; flex-wrap: nowrap; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 1rem; }
      .btn-home { display: inline-flex; min-height: 2.5rem; flex-shrink: 0; align-items: center; gap: 0.375rem; white-space: nowrap; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 0 1rem; font-size: 0.875rem; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      @media (min-width: 1024px) { .btn-home { min-height: 3rem; padding: 0 1.5rem; font-size: 1.125rem; } }
      .btn-home svg { width: 1rem; height: 1rem; }

      .flash-card { position: relative; overflow: hidden; padding: 1rem 1.25rem; text-align: center; }
      .flash-card.revealed { padding-top: 2rem; padding-bottom: 2rem; }
      @media (min-width: 640px) { .flash-card { padding-left: 2rem; padding-right: 2rem; } }
      @media (min-width: 1024px) { .flash-card { padding-left: 2.5rem; padding-right: 2.5rem; } .flash-card.revealed { padding-top: 3rem; padding-bottom: 3rem; } }
      .flash-card .inner { position: relative; }
      .big-word { margin: 0 0 0.5rem; font-size: 2.25rem; font-weight: 600; overflow-wrap: break-word; }
      @media (min-width: 640px) { .big-word { font-size: 3rem; } }
      @media (min-width: 1024px) { .big-word { font-size: 3.75rem; } }
      .ipa-line { margin: 0; font-size: 1rem; line-height: 1.7; }
      @media (min-width: 640px) { .ipa-line { font-size: 1.125rem; } }
      @media (min-width: 1024px) { .ipa-line { font-size: 1.25rem; } }
      .ipa-line.dim { color: var(--dim); }
      .ipa-line .one { display: inline-block; white-space: nowrap; margin: 0 0.125rem; }
      .ipa-line .tag { margin-left: 0.25rem; font-size: 0.875rem; }
      .ipa-stack { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; }
      .meaning { margin: 1rem auto 0; max-width: 28rem; font-size: 1.125rem; line-height: 1.7; }
      @media (min-width: 640px) { .meaning { font-size: 1.25rem; } }
      @media (min-width: 1024px) { .meaning { max-width: 36rem; font-size: 1.5rem; } }
      .btn-listen { margin-top: 1rem; min-height: 2.75rem; border-radius: 999px; background: var(--accent); padding: 0 1.5rem; font-weight: 600; color: #fff; }
      @media (prefers-color-scheme: dark) { .btn-listen { color: #0b1512; } }
      @media (min-width: 1024px) { .btn-listen { min-height: 3rem; padding: 0 2rem; font-size: 1.125rem; } }
      .btn-listen.small { min-height: 2.5rem; padding: 0 1.25rem; font-size: 0.875rem; margin-top: 0.75rem; }
      .chips { margin-top: 0.75rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
      .chip { display: inline-flex; min-height: 2.25rem; align-items: center; gap: 0.375rem; border-radius: 999px; border: 1px solid var(--border); background: var(--bg); padding: 0.375rem 0.75rem; font-size: 0.875rem; }
      .chip .fm { font-weight: 500; }
      .chip .ip { color: var(--dim); }
      .reveal-row { margin: 1rem auto 0; max-width: 28rem; }
      .flash-card.revealed .reveal-row { margin-top: 1.5rem; }
      .btn-outline { min-height: 2.75rem; border-radius: 999px; border: 1px solid var(--border); padding: 0 1.5rem; font-weight: 500; background: var(--surface); }
      @media (min-width: 1024px) { .btn-outline { min-height: 3rem; padding: 0 2rem; font-size: 1.125rem; } }

      .judge-row { margin-top: 1.25rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
      @media (min-width: 640px) { .judge-row { gap: 0.75rem; } }
      .btn-judge { min-height: 3rem; border-radius: 999px; padding: 0 1rem; font-size: 0.875rem; font-weight: 600; }
      @media (min-width: 640px) { .btn-judge { padding: 0 1.5rem; font-size: 1rem; } }
      @media (min-width: 1024px) { .btn-judge { min-height: 3.5rem; padding: 0 2rem; font-size: 1.125rem; } }
      .btn-wrong { border: 1px solid var(--red-border); background: var(--red-bg); color: var(--red-text); }
      .btn-wrong.on { background: #dc2626; color: #fff; border-color: #dc2626; }
      .btn-correct { border: 1px solid var(--green-border); background: var(--green-bg); color: var(--green-text); }
      .btn-correct.on { background: #16a34a; color: #fff; border-color: #16a34a; }
      .btn-next { min-height: 3rem; border-radius: 999px; background: var(--text); padding: 0 1.25rem; font-size: 0.875rem; font-weight: 600; color: var(--bg); }
      @media (min-width: 640px) { .btn-next { padding: 0 1.75rem; font-size: 1rem; } }
      @media (min-width: 1024px) { .btn-next { min-height: 3.5rem; padding: 0 2.25rem; font-size: 1.125rem; } }
      .btn-next:disabled { opacity: 0.35; }
      .btn-judge:disabled { opacity: 0.35; }

      .stats { margin-top: 1rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.875rem; color: var(--dim); }
      @media (min-width: 1024px) { .stats { font-size: 1rem; } }
      .end-row { margin-top: 1rem; text-align: center; }
      .btn-end { display: inline-flex; min-height: 2.75rem; align-items: center; gap: 0.5rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 0 1.5rem; font-weight: 500; }
      @media (min-width: 1024px) { .btn-end { min-height: 3rem; padding: 0 2rem; font-size: 1.125rem; } }
      .btn-end svg { width: 1rem; height: 1rem; }

      .quiz-card { padding: 2rem 1.25rem; }
      @media (min-width: 640px) { .quiz-card { padding-left: 2rem; padding-right: 2rem; } }
      @media (min-width: 1024px) { .quiz-card { padding: 2.5rem; } }
      .quiz-hint { margin: 0 0 0.75rem; text-align: center; font-size: 0.875rem; color: var(--dim); }
      @media (min-width: 1024px) { .quiz-hint { font-size: 1rem; } }
      .quiz-meaning { margin: 0 0 1.5rem; min-height: 3.5rem; text-align: center; font-size: 1.25rem; line-height: 1.7; }
      @media (min-width: 640px) { .quiz-meaning { font-size: 1.5rem; } }
      @media (min-width: 1024px) { .quiz-meaning { min-height: 4rem; font-size: 1.875rem; } }
      .quiz-input { min-height: 3rem; width: 100%; border-radius: 0.75rem; border: 1px solid var(--border); background: var(--bg); padding: 0 1rem; text-align: center; font-size: 1.125rem; outline: none; }
      .quiz-input:focus { border-color: var(--accent); }
      .quiz-input:disabled { opacity: 0.6; }
      @media (min-width: 1024px) { .quiz-input { min-height: 3.5rem; font-size: 1.25rem; } }
      .feedback { margin-top: 1rem; border-radius: 0.75rem; padding: 0.75rem 1rem; text-align: center; font-size: 1rem; }
      @media (min-width: 1024px) { .feedback { padding: 1rem 1.5rem; font-size: 1.125rem; } }
      .feedback.ok { background: var(--green-bg); color: var(--green-text); }
      .feedback.bad { background: var(--red-bg); color: var(--red-text); }
      .feedback .fb-text { font-weight: 600; margin: 0; }
      .feedback .fb-word { margin: 0.5rem 0 0; font-size: 1.5rem; font-weight: 600; color: var(--text); }
      @media (min-width: 1024px) { .feedback .fb-word { font-size: 2.25rem; } }
      .quiz-btns { margin-top: 1.25rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.75rem; }
      .btn-ghost { min-height: 3rem; border-radius: 999px; border: 1px solid var(--border); padding: 0 1.5rem; font-weight: 500; color: var(--dim); background: var(--surface); }
      @media (min-width: 1024px) { .btn-ghost { min-height: 3.5rem; padding: 0 2rem; font-size: 1.125rem; } }

      .pile-pill { position: fixed; right: 1rem; z-index: 30; display: inline-flex; min-height: 3rem; align-items: center; gap: 0.5rem; border-radius: 999px; background: var(--text); padding: 0 1.25rem; font-weight: 600; color: var(--bg); box-shadow: 0 10px 15px rgba(0,0,0,0.2); bottom: calc(20px + env(safe-area-inset-bottom)); }
      .pile-pill .n { border-radius: 999px; background: #dc2626; padding: 0.125rem 0.625rem; font-size: 0.875rem; color: #fff; }

      .overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.5); }
      @media (min-width: 640px) { .overlay { align-items: center; padding: 1.5rem; } }
      .sheet { width: 100%; max-width: 28rem; max-height: 92vh; overflow-y: auto; border-radius: 1.5rem 1.5rem 0 0; background: var(--surface); padding: 1.5rem; box-shadow: 0 20px 25px rgba(0,0,0,0.2); }
      @media (min-width: 640px) { .sheet { border-radius: 1.5rem; } }
      @media (min-width: 1024px) { .sheet.wide { max-width: 32rem; padding: 1.5rem 2rem 2rem; } }
      .sheet h3 { margin: 0; font-size: 1.125rem; font-weight: 700; }
      .sheet .row-between { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.75rem; }
      .btn-close { min-height: 2.75rem; flex-shrink: 0; border-radius: 999px; border: 1px solid var(--border); padding: 0 1.25rem; font-weight: 500; background: var(--surface); }
      .sheet .note { font-size: 0.875rem; line-height: 1.7; color: var(--dim); }
      .sheet textarea { width: 100%; border-radius: 0.75rem; border: 1px solid var(--border); background: var(--bg); padding: 0.75rem; font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; line-height: 1.7; }
      .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .btn-danger { min-height: 3rem; border-radius: 999px; background: #dc2626; padding: 0 1.5rem; font-weight: 600; color: #fff; }
      .rate-big { margin: 1rem 0; text-align: center; font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
      .center { text-align: center; }
      .fname { margin: 0 0 0.25rem; font-size: 0.875rem; font-weight: 500; overflow-wrap: anywhere; }

      .book-overlay { position: fixed; inset: 0; z-index: 40; overflow-y: auto; background: var(--bg); }
      .book-wrap { margin: 0 auto; width: 100%; max-width: 42rem; padding: 1rem 1rem 4rem; }
      @media (min-width: 1024px) { .book-wrap { max-width: 56rem; padding-left: 2rem; padding-right: 2rem; } }
      .book-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1rem; }
      .book-head h2 { margin: 0; font-size: 1.25rem; font-weight: 700; }
      @media (min-width: 1024px) { .book-head h2 { font-size: 1.5rem; } }
      .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); padding: 0.25rem; margin-bottom: 0.75rem; }
      .seg button { min-height: 2.5rem; border-radius: 999px; font-weight: 600; color: var(--dim); }
      .seg button.on-dark { background: var(--text); color: var(--bg); }
      .seg button.on-accent { background: var(--accent); color: #fff; }
      @media (prefers-color-scheme: dark) { .seg button.on-accent { color: #0b1512; } }
      .practice-box { margin-bottom: 1rem; border-radius: 1rem; border: 1px solid var(--accent); background: var(--surface); padding: 1rem; text-align: center; }
      .practice-box p { margin: 0 0 0.75rem; font-size: 0.875rem; line-height: 1.7; color: var(--dim); }
      .practice-box button { min-height: 3rem; border-radius: 999px; background: var(--accent); padding: 0 1.75rem; font-weight: 600; color: #fff; }
      @media (prefers-color-scheme: dark) { .practice-box button { color: #0b1512; } }
      .practice-box button:disabled { opacity: 0.4; }
      .io-box { margin-bottom: 1rem; border-radius: 1rem; border: 1px solid var(--border); background: var(--surface); padding: 1rem; }
      .io-box p { margin: 0 0 0.75rem; font-size: 0.875rem; line-height: 1.7; color: var(--dim); }
      .io-box .btn-row button { min-height: 2.75rem; border-radius: 999px; border: 1px solid var(--border); padding: 0 1.25rem; font-weight: 500; background: var(--surface); }
      .io-box .btn-row button.armed { background: #dc2626; color: #fff; border-color: #dc2626; }
      .io-box .btn-row button.clear-btn { border-color: var(--red-border); background: var(--red-bg); color: var(--red-text); }
      .arm-alert { margin-top: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--red-border); background: var(--red-bg); padding: 0.75rem 1rem; text-align: center; font-size: 0.875rem; font-weight: 600; line-height: 1.7; color: var(--red-text); }
      .empty-note { padding: 2.5rem 0; text-align: center; color: var(--dim); margin: 0; }
      .book-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
      .book-item { display: flex; min-height: 3.5rem; width: 100%; align-items: center; justify-content: space-between; gap: 0.75rem; border-radius: 0.75rem; border: 1px solid var(--border); background: var(--surface); padding: 0.75rem 1rem; text-align: left; }
      .book-item .w { display: block; font-size: 1.125rem; font-weight: 600; }
      @media (min-width: 1024px) { .book-item .w { font-size: 1.25rem; } }
      .book-item .m { display: block; font-size: 0.875rem; color: var(--dim); }
      @media (min-width: 1024px) { .book-item .m { font-size: 1rem; } }
      .book-item .r { display: block; font-size: 0.75rem; color: var(--dim); }
      .book-item .cnt { flex-shrink: 0; border-radius: 999px; background: var(--red-bg); padding: 0.25rem 0.75rem; font-size: 0.875rem; font-weight: 600; color: var(--red-text); }
      .clear-row { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
      .clear-row button { min-height: 2.75rem; border-radius: 999px; border: 1px solid var(--border); padding: 0 1.25rem; font-weight: 500; background: var(--surface); }

      .modal-word { margin: 0 0 0.5rem; font-size: 1.875rem; font-weight: 600; overflow-wrap: break-word; }
      @media (min-width: 1024px) { .modal-word { font-size: 2.25rem; } }
      .modal-meaning { margin: 1.25rem 0 0; font-size: 1.125rem; line-height: 1.7; }
      @media (min-width: 1024px) { .modal-meaning { font-size: 1.25rem; } }
      .modal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }

      .stamp { position: absolute; top: 50%; width: 6rem; height: 6rem; transform: translateY(-50%); pointer-events: none; }
      .stamp.left { left: 6%; }
      .stamp.right { right: 6%; }
      @media (min-width: 640px) { .stamp { width: 7rem; height: 7rem; } }
      @media (min-width: 1024px) { .stamp { width: 8rem; height: 8rem; } }
      .stamp svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.14)); }
      @keyframes stamp-pop {
        0% { opacity: 0; scale: 1.7; }
        55% { opacity: 1; scale: 0.93; }
        100% { opacity: 1; scale: 1; }
      }
      .stamp-pop { animation: stamp-pop 0.28s ease-out both; }
      .stamp-rot-l { rotate: -12deg; }
      .stamp-rot-r { rotate: 12deg; }
      @media (prefers-reduced-motion: reduce) { .stamp-pop { animation: none; } }

      .toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; width: max-content; max-width: 92vw; border-radius: 999px; background: var(--text); padding: 0.75rem 1.25rem; text-align: center; font-size: 0.875rem; font-weight: 500; color: var(--bg); box-shadow: 0 10px 15px rgba(0,0,0,0.2); bottom: calc(96px + env(safe-area-inset-bottom)); }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
      .hidden { display: none !important; }
    </style>
  </head>

      function render() {
        var app = document.getElementById("app");
        var activeRound = (state.view === "flash" && state.flashRound.status === "active") ||
          (state.view === "quiz" && state.quizRound.status === "active");

        h += '<div class="topbar"><p class="count">共 <strong>777</strong> 个词 · the — statement</p>';
        if (!activeRound) {
          h += '<span class="accent-row"><span class="lbl">发音：</span>' + accentSwitchHTML(false, "发音口音切换") + '</span>';

        h += '</div>';
        h += '<div class="tabs" role="tablist" aria-label="练习模式">' +
          '<button type="button" role="tab" aria-selected="' + (state.view === "flash") + '" class="' + (state.view === "flash" ? "on" : "") + '" onclick="setView(\'flash\')">英译中闪卡</button>' +

        h += state.view === "flash" ? flashHTML() : quizHTML();

        var pileRound = pileMode === "flash" ? state.flashRound : state.quizRound;
        var pile = pileMode === "flash" ? state.flashPile : state.quizPile;
        if (pileRound.status === "active") {
          h += '<button type="button" class="pile-pill" aria-label="不知道的词，' + pile.length + ' 个，打开查看本轮正确率" onclick="openPile(\'' + pileMode + '\')">不知道的词<span class="n">' + pile.length + '</span></button>';

        h += modalHTML();
        h += exportPanelHTML();
        h += pasteHTML();
        h += clearConfirmHTML();

        renderToast();
        /* 弹窗打开期间锁住背景滚动，关掉后回到原位置 */
        var lock = state.pasteImport !== null || state.clearConfirm !== null;
        if (lock && !render._locked) {
          render._y = window.scrollY;
          document.body.style.overflow = "hidden";
          render._locked = true;
        } else if (!lock && render._locked) {
          document.body.style.overflow = "";
          render._locked = false;
          window.scrollTo(0, render._y || 0);

      /* ================= handlers ================= */
      function setView(v) { state.view = v; render(); }
      function finishToIdle(mode) {
        if (mode === "flash") state.flashRound = idleRound(); else state.quizRound = idleRound();
        render();
      }
      function speakCurrent(mode) {
        var r = mode === "flash" ? state.flashRound : state.quizRound;
        var entry = WORDS[r.current];
        if (entry) speakWord(entry.word, state.accent);
      }
      function speakModal() {
        if (state.modalWord) speakWord(state.modalWord.word, state.accent);
      }

      /* ----- flash ----- */
      function startFlashRound(pool, isReview) {
        var q = shuffle(pool);
        var first = q.shift();
        state.flashRound = {
          status: first === undefined ? "finished" : "active",
          queue: q, current: first === undefined ? -1 : first,
          total: pool.length, correct: 0, wrong: 0, isReview: !!isReview
        };
        state.flashRevealed = false;
        state.flashJudged = null;
        state.flashPile = [];
        render();
      }
      function finishFlashRound(r) {
        state.flashRound = { status: "finished", queue: [], current: -1, total: r.total, correct: r.correct, wrong: r.wrong, isReview: r.isReview };
        state.flashPanel = { correct: r.correct, wrong: r.wrong, total: r.total };
        render();
      }
      function toggleReveal() { state.flashRevealed = !state.flashRevealed; render(); }
      function flashJudge(kind) {
        var r = state.flashRound;
        var entry = WORDS[r.current];
        if (!entry || r.status !== "active") return;
        if (kind === "correct" && !state.flashRevealed) return;
        if (state.flashJudged === kind) return;
        var prev = state.flashJudged;
        if (kind === "wrong") {
          state.flashRevealed = true;
          recordError("flash", entry, "不会/错误", 1);
          if (state.flashPile.indexOf(r.current) === -1) state.flashPile.push(r.current);
        } else if (prev === "wrong") {
          recordError("flash", entry, "不会/错误", -1);
          state.flashPile = state.flashPile.filter(function (x) { return x !== r.current; });
        }
        state.flashJudged = kind;
        render();
      }
      function flashNext() {
        var r = state.flashRound;
        if (r.status !== "active" || state.flashJudged === null) return;
        var judged = state.flashJudged;
        var nr = {
          status: r.status, queue: r.queue.slice(), current: r.current, total: r.total,
          correct: r.correct + (judged === "correct" ? 1 : 0),
          wrong: r.wrong + (judged === "wrong" ? 1 : 0),
          isReview: r.isReview
        };
        var nextIdx = nr.queue.shift();
        state.flashRevealed = false;
        state.flashJudged = null;
        if (nextIdx === undefined) {
          state.flashRound = { status: "active", queue: [], current: -1, total: nr.total, correct: nr.correct, wrong: nr.wrong, isReview: nr.isReview };
          finishFlashRound(nr);
        } else {
          nr.current = nextIdx;
          state.flashRound = nr;
          render();
        }
      }
      function endRound(mode) {
        if (mode === "flash") {
          var r = state.flashRound;
          if (r.status !== "active") return;
          var c = r.correct, w = r.wrong;
          if (state.flashJudged === "correct") c += 1;
          else if (state.flashJudged === "wrong") w += 1;
          startFlashRound(ALL_INDICES, false);
          if (c + w > 0) showToast("上一轮已结算：正确率 " + rateText(c, w) + "（答对 " + c + " · 答错 " + w + "），已开始新一轮");
          else showToast("已结束本轮，开始新一轮");
        } else {
          var q = state.quizRound;
          if (q.status !== "active") return;
          var c2 = q.correct, w2 = q.wrong;
          if (state.quizFeedback) {
            if (state.quizFeedback.kind === "correct") c2 += 1; else w2 += 1;
          }
          startQuizRound(ALL_INDICES, false);
          if (c2 + w2 > 0) showToast("上一轮已结算：正确率 " + rateText(c2, w2) + "（答对 " + c2 + " · 答错 " + w2 + "），已开始新一轮");
          else showToast("已结束本轮，开始新一轮");
        }
      }
      function goHome(mode) {
        if (mode === "flash") {
          state.flashRound = idleRound();
          state.flashRevealed = false;
          state.flashJudged = null;
          state.flashPile = [];
          state.flashPanel = null;
        } else {
          state.quizRound = idleRound();
          state.quizInput = "";
          state.quizFeedback = null;
          quizAnswered = false;
          state.quizPile = [];
          state.quizPanel = null;
        }
        render();
      }

      /* ----- quiz ----- */
      function startQuizRound(pool, isReview) {
        var q = shuffle(pool);
        var first = q.shift();
        state.quizRound = {
          status: first === undefined ? "finished" : "active",
          queue: q, current: first === undefined ? -1 : first,
          total: pool.length, correct: 0, wrong: 0, isReview: !!isReview
        };
        state.quizInput = "";
        state.quizFeedback = null;
        quizAnswered = false;
        state.quizPile = [];
        render();
        focusQuizInput();
      }
      function finishQuizRound(r) {
        state.quizRound = { status: "finished", queue: [], current: -1, total: r.total, correct: r.correct, wrong: r.wrong, isReview: r.isReview };
        state.quizPanel = { correct: r.correct, wrong: r.wrong, total: r.total };
        render();
      }
      function focusQuizInput() {
        setTimeout(function () {
          var el = document.getElementById("quiz-answer");
          if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
        }, 30);
      }
      function quizInputChange(v) { state.quizInput = v; }
      function quizKey(e) {
        if (e.key === "Enter") {
          if (state.quizFeedback) quizNext(); else quizSubmit();
        }
      }
      function quizSubmit() {
        var r = state.quizRound;
        var entry = WORDS[r.current];
        if (!entry || r.status !== "active" || quizAnswered) return;
        if (!state.quizInput.trim()) { showToast("先输入英文单词，再提交"); return; }
        quizAnswered = true;
        if (answerMatches(state.quizInput, entry.word)) {
          state.quizFeedback = { kind: "correct", text: "✓ 正确" };
        } else {
          recordError("quiz", entry, "拼写错误", 1);
          if (state.quizPile.indexOf(r.current) === -1) state.quizPile.push(r.current);
          state.quizFeedback = { kind: "wrong", text: "✗ 不正确，正确答案：" + entry.word };
        }
        render();
      }
      function quizUnknown() {
        var r = state.quizRound;
        var entry = WORDS[r.current];
        if (!entry || r.status !== "active" || quizAnswered) return;
        quizAnswered = true;
        recordError("quiz", entry, "不知道", 1);
        if (state.quizPile.indexOf(r.current) === -1) state.quizPile.push(r.current);
        state.quizFeedback = { kind: "unknown", text: "正确答案：" + entry.word };
        render();
      }
      function quizNext() {
        var fb = state.quizFeedback;
        if (!fb) return;
        var r = state.quizRound;
        var nr = {
          status: r.status, queue: r.queue.slice(), current: r.current, total: r.total,
          correct: r.correct + (fb.kind === "correct" ? 1 : 0),
          wrong: r.wrong + (fb.kind === "correct" ? 0 : 1),
          isReview: r.isReview
        };
        var nextIdx = nr.queue.shift();
        state.quizInput = "";
        state.quizFeedback = null;
        quizAnswered = false;
        if (nextIdx === undefined) {
          state.quizRound = { status: "active", queue: [], current: -1, total: nr.total, correct: nr.correct, wrong: nr.wrong, isReview: nr.isReview };
          finishQuizRound(nr);
        } else {
          nr.current = nextIdx;
          state.quizRound = nr;
          render();
          focusQuizInput();
        }
      }

      /* ----- pile ----- */
      function openPile(mode) {
        var r = mode === "flash" ? state.flashRound : state.quizRound;
        var p = { correct: r.correct, wrong: r.wrong, total: r.total };
        if (mode === "flash") state.flashPanel = p; else state.quizPanel = p;
        render();
      }
      function closePile(mode) {
        if (mode === "flash") state.flashPanel = null; else state.quizPanel = null;
        render();
      }
      function startPilePractice(mode) {
        var pool = (mode === "flash" ? state.flashPile : state.quizPile).slice();
        if (mode === "flash") state.flashPanel = null; else state.quizPanel = null;
        if (pool.length) {
          if (mode === "flash") startFlashRound(pool, true); else startQuizRound(pool, true);
        } else render();
      }
      function pileFinish(mode) {
        if (mode === "flash") { state.flashPanel = null; state.flashRound = idleRound(); }
        else { state.quizPanel = null; state.quizRound = idleRound(); }
        render();
      }

      /* ----- notebook ----- */
      function disarmImport() {
        state.importArmed = false;
        if (importArmTimer) { clearTimeout(importArmTimer); importArmTimer = null; }
      }
      function openBook(mode) {
        state.bookMode = mode;
        state.bookTab = "session";
        disarmImport();
        state.bookOpen = true;
        render._bookScroll = 0;
        render();
      }
      function closeBook() { state.bookOpen = false; render(); }
      function setBookMode(m) { state.bookMode = m; disarmImport(); render(); }
      function setBookTab(t) { state.bookTab = t; render(); }
      function startBookPractice(tab) {
        var mode = state.bookMode;
        var book = bookFor(mode, tab);
        var pool = [];
        Object.keys(book).forEach(function (key) {
          var idx = wordIndexByKey[key];
          if (idx !== undefined) pool.push(idx);
        });
        if (!pool.length) {
          showToast(tab === "history" ? "历史错题是空的，还没有可以练习的词" : "本次错题是空的，还没有可以练习的词");
          return;
        }
        state.bookOpen = false;
        state.view = mode;
        if (mode === "flash") startFlashRound(pool, false); else startQuizRound(pool, false);
      }
      function openModalWord(key) {
        var idx = wordIndexByKey[key];
        if (idx !== undefined) { state.modalWord = WORDS[idx]; render(); return; }
        var rec = bookFor(state.bookMode, state.bookTab)[key];
        if (rec) state.modalWord = { word: rec.word, ipa: rec.ipa, meaning: rec.meaning };
        render();
      }
      function closeModal() { state.modalWord = null; render(); }
      function openClearConfirm(which) {
        var bo = document.getElementById("book-overlay");
        render._bookScroll = bo ? bo.scrollTop : 0;
        state.clearConfirm = which;
        render();
      }
      function closeClearConfirm() { state.clearConfirm = null; render(); }
      function confirmClear() {
        var which = state.clearConfirm;
        if (!which) return;
        state.clearConfirm = null;
        if (which === "history") {
          state.history[state.bookMode] = {};
          saveHistory();
          showToast("历史错题已清空");
        } else {
          state.session[state.bookMode] = {};
          showToast("本次错题已清空，历史错题不受影响");
        }
        render();
      }

      /* ----- import / export ----- */
      function downloadBackupFile(filename, text) {
        var blob = new Blob([text], { type: "application/octet-stream" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      }
      function handleExport() {
        var hist = state.history[state.bookMode];
        var keys = Object.keys(hist);
        if (!keys.length) { showToast("历史错题是空的，没有可导出的记录"); return; }
        var now = new Date();
        var payload = {
          app: "词汇表（英语兔）",
          kind: "错题本历史错题备份",
          mode: state.bookMode,
          modeName: state.bookMode === "flash" ? "英译中" : "中译英",
          exportedAt: now.toISOString(),
          items: hist
        };
        function pad(n) { return String(n).padStart(2, "0"); }
        var filename = "错题本-" + payload.modeName + "-历史错题-" + keys.length + "词-英语兔777词-" + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + ".json";
        var text = JSON.stringify(payload, null, 2);
        var coarse = typeof window.matchMedia === "function" && window.matchMedia("(pointer: coarse)").matches;
        if (coarse && typeof navigator.canShare === "function") {
          try {
            var file = new File([text], filename, { type: "application/json" });
            if (navigator.canShare({ files: [file] })) {
              navigator.share({ files: [file], title: filename }).then(function () {
                showToast("已导出 " + keys.length + " 个词的历史错题");
              }, function (err) {
                if (err && err.name === "AbortError") return;
                state.exportPanel = { filename: filename, text: text, count: keys.length };
                render();
              });
              return;
            }
          } catch (e) {}
        }
        if (coarse) {
          state.exportPanel = { filename: filename, text: text, count: keys.length };
          render();
          return;
        }
        downloadBackupFile(filename, text);
        showToast("已导出 " + keys.length + " 个词的历史错题");
      }
      function closeExport() { state.exportPanel = null; render(); }
      function copyExportText() {
        if (!state.exportPanel) return;
        var text = state.exportPanel.text;
        function done() { showToast("备份内容已复制，粘贴到备忘录或文件里保存成 .json 文件即可"); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(done); });
        } else fallbackCopy(done);
      }
      function fallbackCopy(done) {
        var ta = document.getElementById("export-text");
        if (ta) {
          ta.focus();
          ta.select();
          try { if (document.execCommand("copy")) { done(); return; } } catch (e) {}
        }
        showToast("自动复制没成功，请长按下面内容、全选后手动复制");
      }
      function applyImportedData(data, action) {
        var books = normalizeImportedBooks(data, state.bookMode);
        if (!books) { showToast("读不出错题记录，请确认用的是导出的备份"); return false; }
        var modes = Object.keys(books).filter(function (m) { return books[m]; });
        var added = 0, merged = 0, skipped = 0;
        modes.forEach(function (m) {
          var res = mergeBookInto(state.history[m], books[m]);
          added += res.added; merged += res.merged; skipped += res.skipped;
        });
        saveHistory();
        var both = modes.length > 1 ? "（英译中和中译英都已导入）" : "";
        var skipNote = skipped ? "，" + skipped + " 次重复错次已跳过（不重复计数）" : "";
        if (action === "import") {
          showToast("导入完成：新增 " + added + " 个词，更新 " + merged + " 个词，原有记录一条没丢" + skipNote + both);
        } else {
          showToast("合并完成：新增 " + added + " 个词，更新 " + merged + " 个词" + skipNote + both);
        }
        return true;
      }
      function pickFile(action) {
        disarmImport();
        ioAction = action;
        var fi = document.getElementById("file-input");
        fi.value = "";
        fi.click();
      }
      function armOrPickImport() {
        if (!state.importArmed) {
          state.importArmed = true;
          if (importArmTimer) clearTimeout(importArmTimer);
          importArmTimer = setTimeout(function () { state.importArmed = false; render(); }, 6000);
          render();
          return;
        }
        pickFile("import");
      }
      function openPaste() { state.pasteImport = { text: "" }; render(); }
      function closePaste() { state.pasteImport = null; render(); }
      function doPasteImport() { doPaste("import"); }
      function doPasteMerge() { doPaste("merge"); }
      function doPaste(action) {
        var ta = document.getElementById("paste-text");
        var text = ta ? ta.value : "";
        try {
          if (applyImportedData(parseBackupText(text), action)) {
            state.pasteImport = null;
            render();
          }
        } catch (e) {
          showToast("这份内容读不出错题记录，请把备份的全部内容原样粘贴进来");
        }
      }

      document.getElementById("file-input").addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        e.target.value = "";
        var action = ioAction;
        ioAction = null;
        if (!f || !action) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            applyImportedData(parseBackupText(String(reader.result == null ? "" : reader.result)), action);
            render();
          } catch (err) {
            showToast("这个文件读不出错题记录，请确认选的是导出的备份文件；选文件不行时可以试试「粘贴导入」");
          }
        };
        reader.onerror = function () { showToast("文件读取失败，请重试，或试试「粘贴导入」"); };
        reader.readAsText(f);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && state.modalWord) closeModal();
      });

      render();
    </script>
  </body>
</html>
