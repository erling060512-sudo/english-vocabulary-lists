<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>词汇表（英语兔）</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#faf7f0; --surface:#ffffff; --text:#1f2937; --dim:#78716c;
  --border:#e7e0d2; --accent:#0f766e;
  --bad-bg:#fef2f2; --bad-bd:#fca5a5; --bad-tx:#b91c1c;
  --good-bg:#f0fdf4; --good-bd:#86efac; --good-tx:#15803d;
  --fb-good-bg:#f0fdf4; --fb-good-tx:#166534;
  --fb-bad-bg:#fef2f2; --fb-bad-tx:#991b1b;
  --count-bg:#fef2f2; --count-tx:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171512; --surface:#23201b; --text:#f0ede6; --dim:#a8a29e;
    --border:#3a352c; --accent:#2dd4bf;
    --bad-bg:#450a0a; --bad-bd:#7f1d1d; --bad-tx:#fca5a5;
    --good-bg:#052e16; --good-bd:#14532d; --good-tx:#86efac;
    --fb-good-bg:#052e16; --fb-good-tx:#bbf7d0;
    --fb-bad-bg:#450a0a; --fb-bad-tx:#fecaca;
    --count-bg:#450a0a; --count-tx:#fecaca;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;min-height:2rem}
button:disabled{cursor:not-allowed}
.serif{font-family:Georgia,'Times New Roman',serif}
.wrap{margin:0 auto;width:100%;max-width:42rem;padding:1rem 1rem 7rem}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.topbar .cnt{font-size:.875rem;color:var(--dim)}
.topbar .cnt strong{color:var(--text)}
.accent-wrap{display:flex;align-items:center;gap:.5rem}
.accent-wrap .lbl{font-size:.875rem;color:var(--dim)}
.accent{display:inline-flex;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.25rem}
.accent button{min-height:2.25rem;border-radius:999px;padding:0 1rem;font-size:.875rem;font-weight:600;color:var(--dim)}
.accent button.on{background:var(--text);color:var(--bg)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.25rem;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.25rem;margin-bottom:1.25rem}
.tabs button{min-height:2.75rem;border-radius:999px;font-size:1rem;font-weight:600;color:var(--dim)}
.tabs button.on{background:var(--text);color:var(--bg)}
.card{border:1px solid var(--border);background:var(--surface);border-radius:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.idle{padding:2.5rem 1.25rem;text-align:center}
.idle h2{margin:0 0 .5rem;font-size:1.125rem;font-weight:600}
.idle p.desc{margin:0 auto 1.5rem;max-width:28rem;font-size:.875rem;line-height:1.7;color:var(--dim)}
.btn-accent{display:inline-block;min-height:3rem;border-radius:999px;background:var(--accent);padding:0 2rem;font-size:1rem;font-weight:600;color:#fff}
.btn-accent:disabled{opacity:.4}
.btn-dark{min-height:3rem;border-radius:999px;background:var(--text);color:var(--bg);padding:0 2rem;font-size:1rem;font-weight:600}
.btn-dark:disabled{opacity:.35}
.btn-ghost{min-height:2.75rem;border-radius:999px;border:1px solid var(--border);background:var(--surface);padding:0 1.5rem;font-weight:500}
.btn-speak{display:inline-block;margin-top:1rem;min-height:2.75rem;border-radius:999px;background:var(--accent);padding:0 1.5rem;font-weight:600;color:#fff}
.book-entry{display:flex;width:100%;align-items:center;gap:.75rem;border:1px solid var(--border);background:var(--surface);border-radius:1rem;padding:1rem;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.book-entry .ic{flex:none;display:flex;width:2.75rem;height:2.75rem;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg);border-radius:.75rem;color:var(--accent)}
.book-entry .tt{min-width:0;flex:1}
.book-entry .tt .a{display:block;font-size:1rem;font-weight:600}
.book-entry .tt .b{display:block;margin-top:.125rem;font-size:.875rem;color:var(--dim)}
.book-entry .arw{flex:none;color:var(--dim)}
.backhome{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:1rem}
.backhome button{display:inline-flex;min-height:2.75rem;align-items:center;gap:.5rem;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 1.25rem;font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stage{position:relative;overflow:hidden;padding:2rem 1.25rem;text-align:center}
.stage.compact{padding:1rem 1.25rem}
.stage.compact .reveal-zone{margin-top:1rem}
.stage .word{margin:0 0 .5rem;font-size:2.25rem;font-weight:600;word-break:break-word}
.ipa p{margin:0;font-size:1rem;line-height:1.65;color:var(--text)}
.ipa p.off{color:var(--dim)}
.ipa .one{margin:0 .125rem;display:inline-block;white-space:nowrap}
.ipa .lab{margin-left:.25rem;font-size:.875rem}
/* 练习音标遮挡：每张卡第一次出现时音标朦胧模糊，点一下或鼠标悬停一次后显示，本卡内保持显示，下一张卡重新遮起。只用在练习（闪卡/拼写反馈），错题本不用。 */
.ipa-veil{cursor:pointer;border-radius:.5rem;outline:none}
.ipa-veil:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.ipa-veil .ipa{filter:blur(6px);opacity:.55;user-select:none;-webkit-user-select:none;transition:filter .2s ease,opacity .2s ease}
.chips .fi.blur{filter:blur(4px);opacity:.55;user-select:none;-webkit-user-select:none}
.chips{margin-top:.75rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
.chips button{display:inline-flex;min-height:2.25rem;align-items:center;gap:.375rem;border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:.375rem .75rem;font-size:.875rem}
.chips .fm{font-weight:500}
.chips .fi{color:var(--dim)}
.reveal-zone{margin:1.5rem auto 0;max-width:28rem}
.reveal-zone .meaning{margin:1rem 0 0;min-height:1.75rem;font-size:1.125rem;line-height:1.7}
.reveal-zone .meaning.hide{visibility:hidden}
.judge-row{margin-top:1.25rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.judge-row button{min-height:3rem;border-radius:999px;padding:0 1rem;font-size:.875rem;font-weight:600}
.jbtn-bad{border:1px solid var(--bad-bd);background:var(--bad-bg);color:var(--bad-tx)}
.jbtn-bad.on{background:#dc2626;color:#fff;border-color:#dc2626}
.jbtn-good{border:1px solid var(--good-bd);background:var(--good-bg);color:var(--good-tx)}
.jbtn-good.on{background:#16a34a;color:#fff;border-color:#16a34a}
.jbtn-good:disabled{opacity:.35}
.jbtn-next{background:var(--text);color:var(--bg);padding:0 1.25rem !important}
.jbtn-next:disabled{opacity:.35}
.stats{margin-top:1rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem;font-size:.875rem;color:var(--dim)}
.endround{margin-top:1rem;text-align:center}
.action-row{margin-top:1rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem}
.action-row button{display:inline-flex;min-height:2.75rem;align-items:center;gap:.5rem;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 1.5rem;font-weight:500}
.share-card{width:100%;max-width:28rem;max-height:92vh;overflow-y:auto;border-radius:1.5rem 1.5rem 0 0;background:var(--surface);padding:1.5rem;box-shadow:0 20px 25px rgba(0,0,0,.25)}
.share-card .top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.share-card h3{margin:0;font-size:1.125rem;font-weight:700}
.share-card .fname{margin:0 0 1rem;font-size:.875rem;font-weight:500;word-break:break-all}
.share-card img{width:100%;border:1px solid var(--border);border-radius:.75rem;display:block}
.share-card p.hint{margin:1rem 0 0;font-size:.875rem;line-height:1.7;color:var(--dim)}
.endround button{display:inline-flex;min-height:2.75rem;align-items:center;gap:.5rem;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:0 1.5rem;font-weight:500}
.below-book{margin-top:1rem}
.quiz-card{padding:2rem 1.25rem}
.quiz-card .tip{margin:0 0 .75rem;text-align:center;font-size:.875rem;color:var(--dim)}
.quiz-card .meaning{margin:0 0 1.5rem;min-height:3.5rem;text-align:center;font-size:1.25rem;line-height:1.7}
.quiz-input{display:block;width:100%;min-height:3rem;border:1px solid var(--border);background:var(--bg);border-radius:.75rem;padding:0 1rem;text-align:center;font-size:1.125rem;color:var(--text);outline:none}
.quiz-input:focus{border-color:var(--accent)}
.quiz-input:disabled{opacity:.6}
.feedback{margin-top:1rem;border-radius:.75rem;padding:.75rem 1rem;text-align:center;font-size:1rem}
.feedback.good{background:var(--fb-good-bg);color:var(--fb-good-tx)}
.feedback.bad{background:var(--fb-bad-bg);color:var(--fb-bad-tx)}
.feedback .ft{margin:0;font-weight:600}
.feedback .fw{margin:.5rem 0 0;font-size:1.5rem;font-weight:600;color:var(--text)}
.feedback .btn-speak{margin-top:.75rem;min-height:2.5rem;font-size:.875rem;padding:0 1.25rem}
.quiz-btns{margin-top:1.25rem;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.75rem}
.pill{position:fixed;right:1rem;z-index:30;display:inline-flex;min-height:3rem;align-items:center;gap:.5rem;border-radius:999px;background:var(--text);color:var(--bg);padding:0 1.25rem;font-weight:600;box-shadow:0 10px 15px rgba(0,0,0,.2);bottom:calc(20px + env(safe-area-inset-bottom))}
.pill strong{border-radius:999px;background:#dc2626;padding:.125rem .625rem;font-size:.875rem;color:#fff}
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.sheet{width:100%;max-width:28rem;border-radius:1.5rem 1.5rem 0 0;background:var(--surface);padding:1.75rem 1.5rem;text-align:center;box-shadow:0 20px 25px rgba(0,0,0,.25)}
.sheet h3{margin:0;font-size:1.125rem;font-weight:700}
.sheet .rate{margin:1rem 0;font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sheet .info{margin:0 0 1.5rem;font-size:.875rem;line-height:1.7;color:var(--dim)}
.sheet .btns{display:flex;flex-wrap:wrap;justify-content:center;gap:.75rem}
.sheet .btns button{min-height:3rem;border-radius:999px;padding:0 1.75rem;font-weight:600}
.book-overlay{position:fixed;inset:0;z-index:40;overflow-y:auto;background:var(--bg)}
.book-wrap{margin:0 auto;width:100%;max-width:42rem;padding:1rem 1rem 4rem}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:1rem}
.book-head h2{margin:0;font-size:1.25rem;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.25rem;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:.25rem;margin-bottom:.75rem}
.seg button{min-height:2.5rem;border-radius:999px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--text);color:var(--bg)}
.seg.acc button.on{background:var(--accent);color:#fff}
.practice-box{margin-bottom:1rem;border:1px solid var(--accent);background:var(--surface);border-radius:1rem;padding:1rem;text-align:center}
.practice-box p{margin:0 0 .75rem;font-size:.875rem;line-height:1.7;color:var(--dim)}
.io-box{margin-bottom:1rem;border:1px solid var(--border);background:var(--surface);border-radius:1rem;padding:1rem}
.io-box p{margin:0 0 .75rem;font-size:.875rem;line-height:1.7;color:var(--dim)}
.io-box .row{display:flex;flex-wrap:wrap;gap:.5rem}
.io-box .row button{min-height:2.75rem;border-radius:999px;border:1px solid var(--border);padding:0 1.25rem;font-weight:500}
.io-box .row button.danger-soft{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad-tx)}
.io-box .row button.armed{background:#dc2626;color:#fff;border-color:#dc2626}
.io-warn{margin:.75rem 0 0;border:1px solid var(--bad-bd);background:var(--bad-bg);border-radius:.75rem;padding:.75rem 1rem;text-align:center;font-size:.875rem;font-weight:600;line-height:1.7;color:var(--bad-tx)}
.paste-card{width:100%;max-width:28rem;max-height:92vh;overflow-y:auto;border-radius:1.5rem 1.5rem 0 0;background:var(--surface);padding:1.5rem;box-shadow:0 20px 25px rgba(0,0,0,.25)}
.paste-card .top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.paste-card h3{margin:0;font-size:1.125rem;font-weight:700}
.paste-card p{margin:0 0 1rem;font-size:.875rem;line-height:1.7;color:var(--dim)}
.paste-card textarea{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:.75rem;background:var(--bg);color:var(--text);padding:.75rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;line-height:1.6;margin-bottom:1rem}
.paste-card .row{display:flex;flex-wrap:wrap;gap:.5rem}
.paste-card .row button{min-height:3rem;border-radius:999px;border:1px solid var(--border);padding:0 1.5rem;font-weight:500}
.paste-card .row button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.paste-card .row button.armed{background:#dc2626;border-color:#dc2626;color:#fff}
.confirm-card{width:100%;max-width:28rem;border-radius:1.5rem 1.5rem 0 0;background:var(--surface);padding:1.5rem;box-shadow:0 20px 25px rgba(0,0,0,.25)}
.confirm-card h3{margin:0 0 .75rem;font-size:1.125rem;font-weight:700}
.confirm-card p{margin:0 0 1.25rem;font-size:.875rem;line-height:1.7;color:var(--dim)}
.confirm-card .row{display:flex;flex-wrap:wrap;gap:.5rem}
.confirm-card .row button{min-height:3rem;border-radius:999px;border:1px solid var(--border);padding:0 1.5rem;font-weight:500}
.confirm-card .row button.danger{background:#dc2626;border-color:#dc2626;color:#fff;font-weight:600}
.book-empty{padding:2.5rem 0;text-align:center;color:var(--dim)}
.book-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.book-list .bitem{border:1px solid var(--border);background:var(--surface);border-radius:.75rem;padding:.75rem 1rem}
.book-list .btop{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.book-list .bmain{display:block;flex:1;min-width:0;min-height:0;text-align:left;background:none;border:none;padding:0}
.book-list .bctrls{margin-top:.625rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.book-list .spk{min-height:2rem;border-radius:999px;background:var(--accent);padding:0 .75rem;font-size:.75rem;font-weight:600;color:#fff}
.book-list .accent{padding:.125rem}
.book-list .accent button{min-height:2rem;padding:0 .625rem;font-size:.75rem}
.book-list .chips{justify-content:flex-start;margin-top:.5rem}
.book-list .w{display:block;font-size:1.875rem;font-weight:700}
.book-list .ipa p{font-size:1.125rem}
.book-list .ipa .lab{font-size:.75rem}
.book-list .m{display:block;margin-top:.25rem;font-size:1.125rem;color:var(--text)}
.book-list .c{flex:none;border-radius:999px;background:var(--count-bg);color:var(--count-tx);padding:.25rem .75rem;font-size:.875rem;font-weight:600}
.clear-row{margin-top:1.5rem;display:flex;flex-wrap:wrap;gap:.5rem}
.clear-row button{min-height:2.75rem;border-radius:999px;border:1px solid var(--border);padding:0 1.25rem;font-weight:500}
.clear-row button.armed{background:#dc2626;color:#fff;border-color:#dc2626}
.modal-card{width:100%;max-width:28rem;border-radius:1.5rem 1.5rem 0 0;background:var(--surface);padding:1.5rem;text-align:center;box-shadow:0 20px 25px rgba(0,0,0,.25)}
.modal-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
.modal-card .word{margin:0 0 .5rem;font-size:1.875rem;font-weight:600;word-break:break-word}
.modal-card .meaning{margin:1.25rem 0 0;font-size:1.125rem;line-height:1.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:60;width:max-content;max-width:92vw;border-radius:999px;background:var(--text);color:var(--bg);padding:.75rem 1.25rem;text-align:center;font-size:.875rem;font-weight:500;box-shadow:0 10px 15px rgba(0,0,0,.2);bottom:calc(96px + env(safe-area-inset-bottom))}
.stage-content{position:relative}
.stamp{position:absolute;top:.75rem;width:6rem;height:6rem;pointer-events:none}
.stamp svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.14))}
.stamp-wrong{left:.75rem;transform:rotate(-12deg)}
.stamp-correct{right:.75rem;transform:rotate(12deg)}
@keyframes stamp-pop{0%{opacity:0;scale:1.7}55%{opacity:1;scale:.93}100%{opacity:1;scale:1}}
.stamp-pop{animation:stamp-pop .28s ease-out both}
@media (prefers-reduced-motion: reduce){.stamp-pop{animation:none}}
@media (min-width:640px){
  .stamp{width:7rem;height:7rem;top:1rem}
  .stamp-wrong{left:1rem}
  .stamp-correct{right:1rem}
  .stage .word{font-size:3rem}
  .overlay{align-items:center;padding:1.5rem}
  .sheet,.modal-card,.paste-card,.share-card{border-radius:1.5rem}
  .quiz-card .meaning{font-size:1.5rem}
}
@media (min-width:1024px){
  .wrap,.book-wrap{max-width:56rem;padding-left:2rem;padding-right:2rem}
  .topbar .cnt{font-size:1rem}
  .tabs button{min-height:3rem;font-size:1.125rem}
  .idle{padding:3rem 2.5rem}
  .idle h2{font-size:1.5rem}
  .idle p.desc{max-width:36rem;font-size:1rem}
  .btn-accent,.btn-dark{min-height:3.5rem;padding:0 2.5rem;font-size:1.125rem}
  .book-entry{gap:1rem;padding:1.25rem 1.5rem}
  .book-entry .ic{width:3.5rem;height:3.5rem}
  .book-entry .tt .a{font-size:1.25rem}
  .book-entry .tt .b{font-size:1rem}
  .backhome button{min-height:3rem;padding:0 1.5rem;font-size:1.125rem}
  .stage{padding:3rem 2.5rem}
  .stage.compact{padding:1.5rem 2.5rem}
  .stage .word{font-size:3.75rem}
  .ipa p{font-size:1.25rem}
  .ipa .lab{font-size:1rem}
  .book-list .w{font-size:2.25rem}
  .book-list .ipa p{font-size:1.25rem}
  .book-list .ipa .lab{font-size:.875rem}
  .book-list .m{font-size:1.25rem}
  .book-list .spk{font-size:.875rem}
  .btn-speak{min-height:3rem;padding:0 2rem;font-size:1.125rem}
  .chips button{min-height:2.5rem;padding:.375rem 1rem;font-size:1rem}
  .reveal-zone{max-width:36rem}
  .reveal-zone .meaning{min-height:2.25rem;font-size:1.5rem}
  .judge-row button{min-height:3.5rem;padding:0 2rem;font-size:1.125rem}
  .jbtn-next{padding:0 2.25rem !important}
  .stats{font-size:1rem}
  .endround button{min-height:3rem;padding:0 2rem;font-size:1.125rem}
  .action-row button{min-height:3rem;padding:0 2rem;font-size:1.125rem}
  .quiz-card{padding:2.5rem}
  .quiz-card .tip{font-size:1rem}
  .quiz-card .meaning{min-height:4rem;font-size:1.875rem}
  .quiz-input{min-height:3.5rem;font-size:1.25rem}
  .feedback{padding:1rem 1.5rem;font-size:1.125rem}
  .feedback .fw{font-size:2.25rem}
  .feedback .btn-speak{min-height:2.75rem;font-size:1rem;padding:0 1.5rem}
  .book-head h2{font-size:1.5rem}
  .book-list .w{font-size:1.5625rem}
  .book-list .m{font-size:.9375rem}
  .modal-card{max-width:32rem;padding:2rem}
  .modal-card .word{font-size:2.25rem}
  .modal-card .meaning{font-size:1.25rem}
  .stamp{width:8rem;height:8rem;top:1.25rem}
  .stamp-wrong{left:1.25rem}
  .stamp-correct{right:1.25rem}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="pill-slot"></div>
<div id="panel-slot"></div>
<div id="book-slot"></div>
<div id="modal-slot"></div>
<div id="paste-slot"></div>
<div id="confirm-slot"></div>
<div id="share-slot"></div>
<div id="toast-slot"></div>
<!-- 不设 accept 过滤、不用 display:none：备份文件转手后扩展名/类型常对不上，
     带过滤会在手机文件选择器里变灰选不了；display:none 的文件框靠 JS 触发点击，

/* ================= helpers ================= */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffleArr(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function splitForms(word){
  return String(word == null ? "" : word).split("/").map(function(s){ return s.trim(); }).filter(Boolean);
}
function splitIpaGroup(s){
  var parts = String(s == null ? "" : s).split("/").map(function(x){ return x.trim(); }).filter(Boolean);
  var out = [];
  parts.forEach(function(p){
    p.split(/[；;]/).forEach(function(q){
      var t = q.trim();
      if (t) out.push(t);
    });
  });
  return out;
}
function ipaGroups(ipa){
  var s = String(ipa == null ? "" : ipa).trim();
  if (!s) return [];
  var ukMark = s.indexOf("（英）");
  if (ukMark === -1) return [{ label:"", items: splitIpaGroup(s) }];
  var ukPart = s.slice(0, ukMark);
  var rest = s.slice(ukMark + 3);
  var usMark = rest.indexOf("（美）");
  var usPart = usMark === -1 ? rest : rest.slice(0, usMark);
  return [
    { label:"（英）", items: splitIpaGroup(ukPart) },
    { label:"（美）", items: splitIpaGroup(usPart) }
  ];
}
function ipaVariants(ipa, accent){
  var s = String(ipa == null ? "" : ipa).trim();
  if (!s) return [];
  var ukMark = s.indexOf("（英）");
  if (ukMark === -1) return splitIpaGroup(s);
  var ukPart = s.slice(0, ukMark);
  var rest = s.slice(ukMark + 3);
  var usMark = rest.indexOf("（美）");
  var usPart = usMark === -1 ? rest : rest.slice(0, usMark);
  return splitIpaGroup(accent === "uk" ? ukPart : usPart);
}
function formIpaPairs(entry, accent){
  var forms = splitForms(entry.word);
  if (forms.length < 2) return [];
  var vars = ipaVariants(entry.ipa, accent);
  if (vars.length !== forms.length) return [];
  return forms.map(function(f, i){ return { form: f, ipa: "/" + (vars[i] || "") + "/" }; });
}
function ipaHtml(ipa, accent){
  var groups = ipaGroups(ipa);
  if (!groups.length) return "";
  var h = '<div class="ipa">';
  groups.forEach(function(g){
    var active = groups.length < 2 || (accent === "uk" ? g.label === "（英）" : g.label === "（美）");
    h += '<p' + (active ? '' : ' class="off"') + '>';
    g.items.forEach(function(it){ h += '<span class="one">/' + esc(it) + '/</span>'; });
    if (g.label) h += '<span class="lab">' + esc(g.label) + '</span>';
    h += '</p>';
  });
  return h + '</div>';
}
function formChipsHtml(entry, accent, fnName, blurFi){

/* 电脑端音标悬停防误触：每张新卡出现时只记录、不触发——指针本来就
   停在音标出现的位置上不算悬停；只有指针后来移动过、且移进音标区
   停留约 0.3 秒才显示（中途移开取消计时）。手机点按（onclick）与
   键盘聚焦不受影响。每换一张卡 ipaHoverReset 重置一次。 */
var ipaHover = {
  fc: { moved:false, inside:false, timer:null },
  qz: { moved:false, inside:false, timer:null }
};
function ipaHoverReset(key){
  var s = ipaHover[key];
  s.moved = false; s.inside = false;
  if (s.timer){ clearTimeout(s.timer); s.timer = null; }
}
function ipaHoverEnter(key){ ipaHover[key].inside = true; }
function ipaHoverMove(key, showFn){
  var s = ipaHover[key];
  s.moved = true;
  if (!s.inside || s.timer) return;
  s.timer = setTimeout(function(){
    s.timer = null;
    if (s.inside && s.moved) showFn();
  }, 300);
}
function ipaHoverLeave(key){
  var s = ipaHover[key];
  s.inside = false;
  if (s.timer){ clearTimeout(s.timer); s.timer = null; }
}

   仍直接用 ipaHtml，正常显示。 */
function practiceIpaHtml(ipa, accent, shown, revealFn, hoverKey){

  return '<div class="ipa-veil" role="button" tabindex="0" aria-label="显示音标" title="点一下或把鼠标停在音标上显示" onclick="' + revealFn + '()" onmouseenter="ipaHoverEnter(\'' + hoverKey + '\')" onmousemove="ipaHoverMove(\'' + hoverKey + '\',' + revealFn + ')" onmouseleave="ipaHoverLeave(\'' + hoverKey + '\')" onfocus="' + revealFn + '()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' + revealFn + '();}">' + inner + '</div>';

function normalizeAnswer(s){
  return String(s == null ? "" : s).trim().toLowerCase().replace(/\s+/g, "");
}
function answerMatches(input, target){
  var u = normalizeAnswer(input);
  if (!u) return false;
  if (u === normalizeAnswer(target)) return true;
  var forms = splitForms(target);
  if (forms.length > 1){
    var joined = "";
    for (var i = 0; i < forms.length; i++){
      if (u === normalizeAnswer(forms[i])) return true;
      joined += normalizeAnswer(forms[i]);
    }
    if (u.replace(/\//g, "") === joined) return true;
  }
  return false;
}
function rateText(correct, wrong){
  var done = correct + wrong;
  if (!done) return "—";
  return Math.round((correct / done) * 100) + "%";

function sortedBookEntries(book, bySeqAsc){
  return Object.entries(book).sort(function(a, b){
    if (b[1].count !== a[1].count) return b[1].count - a[1].count;
    return bySeqAsc ? a[1].seq - b[1].seq : b[1].seq - a[1].seq;
  });
}

/* 旧备份只有次数、没有每条错次的编号：按（词，第几次）补出固定编号，
   同一条旧记录在哪个设备上补出来的编号都一样，合并时就能认出是同一条，
   不会重复计数。补的数量正好等于原次数，不改次数。 */
function materializeEvents(wordKey, count, events, at){
  var out = [];
  var seen = {};
  (events || []).forEach(function(e){
    if (!e || !e.id || seen[e.id]) return;
    seen[e.id] = true;
    out.push({ id: e.id, at: typeof e.at === "string" ? e.at : at });
  });
  for (var i = 0; out.length < count; i += 1){
    var id = "legacy:" + wordKey + ":" + i;
    if (seen[id]) continue;
    seen[id] = true;
    out.push({ id: id, at: at });
  }
  return out;

    var word = String(it.word != null ? it.word : (k || "")).trim();
    if (!word) return;
    var count = parseInt(String(it.count != null ? it.count : ""), 10);
    if (!(count > 0)) count = 1;
    var reasons = [];

/* ================= audio (Youdao, device TTS fallback) ================= */
var currentAudio = null;
var speakSeq = 0;
function speakFallback(word, accent, onDone){
  var called = false;
  function done(){ if (called) return; called = true; if (onDone) onDone(); }
  try {
    if (!("speechSynthesis" in window)){ done(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(word);
    u.lang = accent === "uk" ? "en-GB" : "en-US";
    u.rate = 0.82;
    var voices = window.speechSynthesis.getVoices();
    var want = accent === "uk" ? /^en[-_]GB/i : /^en[-_]US/i;
    var v = null, i;
    for (i = 0; i < voices.length; i++){ if (want.test(voices[i].lang)){ v = voices[i]; break; } }
    if (!v){ for (i = 0; i < voices.length; i++){ if (/^en/i.test(voices[i].lang)){ v = voices[i]; break; } } }
    if (v){ u.voice = v; u.lang = v.lang; }
    u.onend = done;
    u.onerror = done;
    window.speechSynthesis.speak(u);
    setTimeout(done, 5000);
  } catch (e) { done(); }
}
function speakOne(word, accent, onDone){
  var finished = false;
  function finish(){ if (finished) return; finished = true; if (onDone) onDone(); }
  var fellBack = false;
  function fallback(){ if (fellBack) return; fellBack = true; speakFallback(word, accent, finish); }
  try {
    if (currentAudio){ try { currentAudio.pause(); } catch (e) {} }
    var type = accent === "uk" ? 1 : 2;
    var url = "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(word) + "&type=" + type;
    var a = new Audio(url);
    currentAudio = a;
    a.addEventListener("ended", finish);
    a.addEventListener("error", fallback);
    var p = a.play();
    if (p && typeof p.catch === "function") p.catch(fallback);
    setTimeout(finish, 6000);
  } catch (e) { fallback(); }
}
function speakWord(word, accent){
  if (!word) return;
  var forms = splitForms(word);
  if (forms.length <= 1){
    speakSeq += 1;
    speakOne(forms[0] || word, accent);
    return;
  }
  var token = ++speakSeq;
  var i = 0;
  function step(){
    if (token !== speakSeq) return;
    if (i >= forms.length) return;
    var f = forms[i];
    i += 1;
    speakOne(f, accent, function(){
      if (token !== speakSeq) return;
      setTimeout(step, 350);
    });
  }
  step();
}

function applyDeltaToBook(book, entry, reason, delta){
  var key = entry.word.toLowerCase();
  var cur = book[key];
  if (delta === 1){
    var nowIso = new Date().toISOString();
    if (cur){
      cur.events = materializeEvents(key, cur.count, cur.events, cur.lastTime || "");
      cur.events.push({ id: newEventId(), at: nowIso });
      cur.count = cur.events.length;
      if (reason && cur.reasons.indexOf(reason) === -1) cur.reasons.push(reason);
      cur.lastTime = nowIso;
      if (!cur.ipa) cur.ipa = entry.ipa;
    } else {
      book[key] = {
        word: entry.word, meaning: entry.meaning, ipa: entry.ipa,
        count: 1, reasons: reason ? [reason] : [],
        events: [{ id: newEventId(), at: nowIso }],
        seq: ++bookSeq, lastTime: nowIso
      };
    }
  } else if (cur){
    if (cur.count <= 1) delete book[key];
    else {
      cur.events = materializeEvents(key, cur.count, cur.events, cur.lastTime || "");
      cur.events.pop();
      cur.count = cur.events.length;
      if (!cur.count) delete book[key];
    }
  }
}
function recordError(mode, entry, reason, delta){
  var session = mode === "flash" ? fcSessionBook : qzSessionBook;

    var nowIso2 = new Date().toISOString();
    if (cur){
      cur.events = materializeEvents(key, cur.count, cur.events, cur.lastTime || "");
      cur.events.push({ id: newEventId(), at: nowIso2 });
      cur.count = cur.events.length;
      if (cur.reasons.indexOf(reason) === -1) cur.reasons.push(reason);
      cur.lastTime = nowIso2;
    } else {
      session[key] = {
        word: entry.word, meaning: entry.meaning, ipa: entry.ipa,
        count: 1, reasons: [reason], seq: ++sessionSeq,
        events: [{ id: newEventId(), at: nowIso2 }],
        lastTime: nowIso2

  } else if (cur){
    if (cur.count <= 1) delete session[key];
    else {
      cur.events = materializeEvents(key, cur.count, cur.events, cur.lastTime || "");
      cur.events.pop();
      cur.count = cur.events.length;
      if (!cur.count) delete session[key];

  if (c + w > 0) showToast("上一轮已结算：正确率 " + rateText(c, w) + "（答对 " + c + " · 答错 " + w + "），已开始新一轮");
  else showToast("已结束本轮，开始新一轮");
}
/* 回到主界面：不结算本轮；已记进错题本的记录都已即时保存，不受影响 */
function qzGoHome(){
  qz = idleRound();
  qzInput = "";
  qzFeedback = null;
  qzAnswered = false;
  qzPile = [];
  qzPanel = { open:false, round:null };
  render();
}

/* ================= pile panel ================= */
function openPilePanel(mode){
  if (mode === "flash"){
    var live = fcLiveCounts();
    fcPanel = { open:true, round:{ correct: live.correct, wrong: live.wrong, total: fc.total } };
  } else {
    qzPanel = { open:true, round:{ correct: qz.correct, wrong: qz.wrong, total: qz.total } };
  }
  render();
}
function pilePanelStartPractice(mode){
  if (mode === "flash"){
    var pool = fcPile.slice();
    /* 这一轮还没练完就开始练错词：先把进行中的这一轮按实时数记进链里，
       复习轮接着往后排，链不断 */
    if (fc.status === "active"){
      var live = fcLiveCounts();
      if (live.correct + live.wrong > 0){
        fcChain.push({ total: fc.total, correct: live.correct, wrong: live.wrong, wrongWords: fcPile.map(function(i){ return WORDS[i].word; }) });
      }
    }
    fcPanel = { open:false, round:null };
    if (pool.length) startFlashRound(pool, true); else render();
  } else {
    var pool2 = qzPile.slice();
    /* 同上：进行中的一轮先记进链（含刚答完还没点「下一个」的这道） */
    if (qz.status === "active"){
      var c = qz.correct + (qzFeedback && qzFeedback.kind === "correct" ? 1 : 0);
      var w = qz.wrong + (qzFeedback && qzFeedback.kind !== "correct" ? 1 : 0);
      if (c + w > 0){
        qzChain.push({ total: qz.total, correct: c, wrong: w, wrongWords: qzPile.map(function(i){ return WORDS[i].word; }) });
      }
    }
    qzPanel = { open:false, round:null };
    if (pool2.length) startQuizRound(pool2, true); else render();
  }
}
function pilePanelFinish(mode){
  if (mode === "flash"){ fcPanel = { open:false, round:null }; fc = idleRound(); fcPile = []; }
  else { qzPanel = { open:false, round:null }; qz = idleRound(); qzPile = []; }
  render();
}
function pilePanelClose(mode){
  if (mode === "flash") fcPanel = { open:false, round:null };
  else qzPanel = { open:false, round:null };
  render();
}

/* ================= 分享卡片 ================= */
/* 卡片数据：链里已练完的轮次按顺序排，正在练的这一轮（如果有）作为
   最后一轮（进行中）一起带上，所以中途任何时候点分享都能导出当前
   进度。错词把整条链每一轮的错词汇总，按错误次数从高到低排。 */
function buildShareData(mode){
  var chain = mode === "flash" ? fcChain : qzChain;
  var round = mode === "flash" ? fc : qz;
  var pile = mode === "flash" ? fcPile : qzPile;
  /* 「练了」按实际判定数算（答对 + 答错），不是这一轮词池的总数。 */
  var rounds = chain.map(function(r){
    return { total: r.correct + r.wrong, correct: r.correct, wrong: r.wrong, wrongWords: r.wrongWords, live: false };
  });
  if (round.status === "active"){
    var c, w;
    if (mode === "flash"){
      var live = fcLiveCounts();
      c = live.correct; w = live.wrong;
    } else {
      c = qz.correct + (qzFeedback && qzFeedback.kind === "correct" ? 1 : 0);
      w = qz.wrong + (qzFeedback && qzFeedback.kind !== "correct" ? 1 : 0);
    }
    rounds.push({ total: c + w, correct: c, wrong: w, wrongWords: pile.map(function(i){ return WORDS[i].word; }), live: true });
  }
  if (!rounds.length) return null;
  var counts = {};
  var orderOf = {};
  var order = 0;
  rounds.forEach(function(r, ri){
    r.wrongWords.forEach(function(word){
      var key = word.toLowerCase();
      if (counts[key]) { counts[key].count += 1; counts[key].lastWrongIdx = ri; }
      else { counts[key] = { word: word, count: 1, lastWrongIdx: ri }; orderOf[key] = order++; }
    });
  });
  var wordByKey = {};
  WORDS.forEach(function(wd){ wordByKey[wd.word.toLowerCase()] = wd; });
  var wrongWords = Object.keys(counts).map(function(k){
    var rec = wordByKey[k];
    var item = counts[k];
    return { word: item.word, count: item.count, ipa: rec ? rec.ipa : "", meaning: rec ? rec.meaning : "" };
  });
  wrongWords.sort(function(a, b){
    if (b.count !== a.count) return b.count - a.count;
    return orderOf[a.word.toLowerCase()] - orderOf[b.word.toLowerCase()];
  });
  var totalCorrect = rounds.reduce(function(acc, r){ return acc + r.correct; }, 0);
  var totalWrong = rounds.reduce(function(acc, r){ return acc + r.wrong; }, 0);
  var first = rounds[0];
  var firstCorrect = first ? first.correct : 0;
  /* 涉及的不同词数（去重）：第一轮答对的词（之后不会再出现）加上
     任何一轮错过的不同词数；后面的轮次只重练错词，不会带来新词。
     第一轮答错、后来练对的词单独记 laterFixed。
     重点词：只要答错过的词都算重点词，按整条链里的答错次数分批，
     错次多的排前面：错 4 次、错 3 次、错 2 次、错 1 次依次列，错
     5 次以上也按实际错次单列（不设上限批）；同批内按首次出错
     顺序。与在线版一致。 */
  var distinctWords = firstCorrect + Object.keys(counts).length;
  var keyCounts = [];
  Object.keys(counts).forEach(function(k){
    if (keyCounts.indexOf(counts[k].count) < 0) keyCounts.push(counts[k].count);
  });
  keyCounts.sort(function(a, b){ return b - a; });
  var keyWordGroups = keyCounts.map(function(n){
    var words = Object.keys(counts).filter(function(k){ return counts[k].count === n; });
    words.sort(function(a, b){ return orderOf[a] - orderOf[b]; });
    return { label: "错了 " + n + " 次的词", words: words.map(function(k){ return counts[k].word; }) };
  });
  var now = new Date();
  return {
    modeLabel: mode === "flash" ? "英译中" : "中译英",
    dateText: now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日",
    rounds: rounds,
    wrongWords: wrongWords,
    distinctWords: distinctWords,
    firstCorrect: firstCorrect,
    keyWordGroups: keyWordGroups,
    laterFixed: totalCorrect - firstCorrect
  };
}
function roundRectPath(ctx, x, y, w, h, r){
  var rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
/* 把卡片画到 1080px 宽的 canvas 上（540 CSS px 的 2 倍）：整体情况
   写能反映掌握程度的统计（涉及的不同词数去重 / 第一次就答对几个与
   首次正确率 / 答错过的重点词按答错次数从多到少分批列
   出来 / 后来练对几个；总答对答错次数不写，后面轮次词少、几乎必
   对，纯次数没意义），再每一轮按顺序列出（练了几个词、答对几个、
   正确率；第 1 轮的正确率标绿，第一次练的正确率才是真正的正确
   率），最后列错词（按错误次数从高到低）。
   与在线版同一张卡片。 */
function drawShareCard(data){
  var u = 2;
  var W = 540 * u;
  var margin = 20 * u;
  var padX = 34 * u;
  var contentX = margin + padX;
  var contentW = W - margin * 2 - padX * 2;
  var sans = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
  var C = { bg: "#faf7f0", surface: "#ffffff", text: "#1f2937", dim: "#78716c", border: "#e7e0d2", accent: "#0f766e", red: "#dc2626", green: "#16a34a", greenBg: "#f0fdf4", greenBorder: "#bbf7d0" };
  function font(size, weight, family){ return weight + " " + (size * u) + "px " + (family || sans); }
  var canvas = document.createElement("canvas");
  canvas.width = W;
  var ctx = canvas.getContext("2d");
  if (!ctx) return canvas;
  /* 错词排版走共用的 layoutShareWords（单列：单词 + ×次数、音标、释义
     折行），先量好每条高度，画布高度才正好装下。 */
  var wordEntries = layoutShareWords(ctx, font, data.wrongWords, contentW);
  /* 整体情况框里的重点词分批名单按框内宽度折行，先量好行数，框高
     和画布高度才正好装下：每批一行标题加折行后的词名行数；没有
     重点词时画一行占位。与在线版一致。 */
  ctx.font = font(14, 400);
  var keyGroups = data.keyWordGroups.map(function(g){
    return { label: g.label, count: g.words.length, lines: wrapCanvasLines(ctx, g.words.join("、"), contentW - 32 * u) };
  });
  var keyLineCount = keyGroups.length
    ? keyGroups.reduce(function(acc, g){ return acc + 1 + g.lines.length; }, 0)
    : 1;
  var summaryBoxH = 90 + keyLineCount * 20;
  var summaryH = (summaryBoxH + 16) * u;
  var wordsH = shareWordsHeight(wordEntries) * u;
  var H = margin * 2
    + (36 + 20 + 8 + 46 + 6 + 22 + 20) * u
    + summaryH
    + (24 + 10) * u
    + data.rounds.length * 60 * u
    + (22 + 24 + 10) * u
    + wordsH
    + (24 + 20 + 32) * u;
  var y = paintShareCardHeader(canvas, ctx, font, C, { u: u, W: W, margin: margin, contentX: contentX }, H, "练习分享卡片", data.modeLabel + " · " + data.dateText + " · 共 " + data.rounds.length + " 轮");
  /* 整体情况，只写能反映掌握程度的：涉及的不同词数（去重）、第一
     次就答对几个与首次正确率、答错过的重点词（按答错次数分批列
     出来）、后来练对几个。总答对答错次数不写。与在线版同一张
     卡片。 */
  roundRectPath(ctx, contentX, y, contentW, summaryBoxH * u, 12 * u);
  ctx.fillStyle = C.bg;
  ctx.fill();
  ctx.strokeStyle = C.border;
  ctx.lineWidth = 1.5 * u;
  ctx.stroke();
  ctx.fillStyle = C.text;
  ctx.font = font(16, 700);
  ctx.fillText("整体情况", contentX + 16 * u, y + 27 * u);
  ctx.font = font(18, 700);
  ctx.textAlign = "right";
  ctx.fillText("首次正确率 " + rateText(data.firstCorrect, data.distinctWords - data.firstCorrect), contentX + contentW - 16 * u, y + 28 * u);
  ctx.textAlign = "left";
  ctx.fillStyle = C.dim;
  ctx.font = font(14, 400);
  ctx.fillText("本次涉及 " + data.distinctWords + " 个不同的词 · 第一次就答对 " + data.firstCorrect + " 个", contentX + 16 * u, y + 52 * u);
  ctx.fillText("后来练对 " + data.laterFixed + " 个", contentX + 16 * u, y + 74 * u);
  if (keyGroups.length){
    var lineY = 96;
    keyGroups.forEach(function(g){
      ctx.fillText("重点词 " + g.count + " 个 · " + g.label + "：", contentX + 16 * u, y + lineY * u);
      lineY += 20;
      g.lines.forEach(function(line){
        ctx.fillText(line, contentX + 16 * u, y + lineY * u);
        lineY += 20;
      });
    });
  } else {
    ctx.fillText("重点词 0 个 · 没有答错过的词", contentX + 16 * u, y + 96 * u);
  }
  y += summaryH;
  ctx.fillStyle = C.text;
  ctx.font = font(16, 700);
  ctx.fillText("每一轮", contentX, y + 17 * u);
  y += (24 + 10) * u;
  data.rounds.forEach(function(r, i){
    var rate = rateText(r.correct, r.wrong);
    ctx.fillStyle = C.text;
    ctx.font = font(18, 700);
    var label = "第 " + (i + 1) + " 轮";
    ctx.fillText(label, contentX, y + 22 * u);
    if (r.live){
      var lw = ctx.measureText(label).width;
      ctx.fillStyle = C.accent;
      ctx.font = font(14, 600);
      ctx.fillText("（进行中）", contentX + lw + 6 * u, y + 22 * u);
    }
    ctx.font = font(18, 700);
    /* 第 1 轮的正确率标绿：第一次练的正确率才是真正的正确率。 */
    ctx.fillStyle = i === 0 ? C.green : C.text;
    ctx.textAlign = "right";
    ctx.fillText("正确率 " + rate, contentX + contentW, y + 22 * u);
    ctx.textAlign = "left";
    ctx.fillStyle = C.dim;
    ctx.font = font(14, 400);
    ctx.fillText("练了 " + r.total + " 个词 · 答对 " + r.correct + " · 答错 " + r.wrong, contentX, y + 46 * u);
    if (i < data.rounds.length - 1){
      ctx.strokeStyle = C.border;
      ctx.lineWidth = 1 * u;
      ctx.beginPath();
      ctx.moveTo(contentX, y + 59 * u);
      ctx.lineTo(contentX + contentW, y + 59 * u);
      ctx.stroke();
    }
    y += 60 * u;
  });
  y += 22 * u;
  ctx.fillStyle = C.text;
  ctx.font = font(16, 700);
  ctx.fillText("错词 · 按错误次数从高到低", contentX, y + 17 * u);
  y += (24 + 10) * u;
  if (!data.wrongWords.length){
    ctx.fillStyle = C.dim;
    ctx.font = font(15, 400);
    ctx.fillText("没有错词，全部答对。", contentX, y + 18 * u);
    y += 28 * u;
  } else {
    y = drawShareWords(ctx, font, C, wordEntries, contentX, y, u);
  }
  y += 24 * u;
  paintShareCardFooter(ctx, font, C, contentX, y, u);
  return canvas;
}
/* ================= 分享卡片共用排版 ================= */
/* 练习卡片与历史错题卡片共用：错词单列排版（第一行单词 + 紧跟其后的
   ×次数，下面音标、再下面释义，按内容宽度折行）、卡面头尾绘制。 */
var SHARE_SERIF = 'Georgia, "Times New Roman", serif';
function wrapCanvasLines(ctx, text, maxW){
  var out = [];
  var line = "";
  for (var ci = 0; ci < text.length; ci++){
    var ch = text.charAt(ci);
    if (line && ctx.measureText(line + ch).width > maxW){ out.push(line); line = ch; }
    else line += ch;
  }
  if (line) out.push(line);
  return out.length ? out : [""];
}
function layoutShareWords(ctx, font, words, contentW){
  return words.map(function(w){
    ctx.font = font(14, 400);
    var ipaLines = w.ipa ? wrapCanvasLines(ctx, w.ipa, contentW) : [];
    ctx.font = font(15, 400);
    var meaningLines = w.meaning ? wrapCanvasLines(ctx, w.meaning, contentW) : [];
    return { word: w.word, count: w.count, ipaLines: ipaLines, meaningLines: meaningLines,
      height: 30 + ipaLines.length * 19 + meaningLines.length * 22 + 22 };
  });
}
function shareWordsHeight(entries){
  return entries.length ? entries.reduce(function(s, e){ return s + e.height; }, 0) : 28;
}
function drawShareWords(ctx, font, C, entries, contentX, y, u){
  entries.forEach(function(e){
    ctx.font = font(19, 600, SHARE_SERIF);
    ctx.fillStyle = C.text;
    ctx.fillText(e.word, contentX, y + 24 * u);
    var wordW = ctx.measureText(e.word).width;
    ctx.font = font(15, 700);
    ctx.fillStyle = C.red;
    ctx.fillText("×" + e.count, contentX + wordW + 8 * u, y + 24 * u);
    var ly = y + 30 * u;
    ctx.font = font(14, 400);
    ctx.fillStyle = C.dim;
    e.ipaLines.forEach(function(line){ ly += 19 * u; ctx.fillText(line, contentX, ly); });
    ctx.font = font(15, 400);
    ctx.fillStyle = C.text;
    e.meaningLines.forEach(function(line){ ly += 22 * u; ctx.fillText(line, contentX, ly); });
    y += e.height * u;
  });
  return y;
}
/* 设定画布高度（会重置 ctx 状态）、画背景面板和卡头（眉题/标题/副题），
   返回副题下方的 y。dims = { u, W, margin, contentX }。 */
function paintShareCardHeader(canvas, ctx, font, C, dims, H, title, subtitle){
  canvas.height = H;
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, dims.W, H);
  roundRectPath(ctx, dims.margin, dims.margin, dims.W - dims.margin * 2, H - dims.margin * 2, 24 * dims.u);
  ctx.fillStyle = C.surface;
  ctx.fill();
  ctx.strokeStyle = C.border;
  ctx.lineWidth = 1.5 * dims.u;
  ctx.stroke();
  var y = dims.margin + 36 * dims.u;
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = C.accent;
  ctx.font = font(14, 700);
  ctx.fillText("词汇表（英语兔）", dims.contentX, y + 15 * dims.u);
  y += (20 + 8) * dims.u;
  ctx.fillStyle = C.text;
  ctx.font = font(32, 800);
  ctx.fillText(title, dims.contentX, y + 34 * dims.u);
  y += (46 + 6) * dims.u;
  ctx.fillStyle = C.dim;
  ctx.font = font(15, 400);
  ctx.fillText(subtitle, dims.contentX, y + 16 * dims.u);
  y += (22 + 20) * dims.u;
  return y;
}
function paintShareCardFooter(ctx, font, C, contentX, y, u){
  ctx.fillStyle = C.dim;
  ctx.font = font(13, 400);
  ctx.fillText("词汇表（英语兔） · 英语兔 777 词", contentX, y + 14 * u);
}
/* 历史错题卡片：没有轮次、没有正确率（历史错题本来就没有），只有错词
   按错误次数从高到低排，格式与练习卡片的错词部分一样。与在线版同一张卡片。 */
function drawHistoryShareCard(data){
  var u = 2;
  var W = 540 * u;
  var margin = 20 * u;
  var padX = 34 * u;
  var contentX = margin + padX;
  var contentW = W - margin * 2 - padX * 2;
  var sans = '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
  var C = { bg: "#faf7f0", surface: "#ffffff", text: "#1f2937", dim: "#78716c", border: "#e7e0d2", accent: "#0f766e", red: "#dc2626", green: "#16a34a", greenBg: "#f0fdf4", greenBorder: "#bbf7d0" };
  function font(size, weight, family){ return weight + " " + (size * u) + "px " + (family || sans); }
  var canvas = document.createElement("canvas");
  canvas.width = W;
  var ctx = canvas.getContext("2d");
  if (!ctx) return canvas;
  var entries = layoutShareWords(ctx, font, data.words, contentW);
  var wordsH = shareWordsHeight(entries) * u;
  var H = margin * 2
    + (36 + 20 + 8 + 46 + 6 + 22 + 20) * u
    + (24 + 10) * u
    + wordsH
    + (24 + 20 + 32) * u;
  var y = paintShareCardHeader(canvas, ctx, font, C, { u: u, W: W, margin: margin, contentX: contentX }, H, "历史错题卡片", data.modeLabel + " · " + data.dateText + " · 共 " + data.words.length + " 个错词");
  ctx.fillStyle = C.text;
  ctx.font = font(16, 700);
  ctx.fillText("错词 · 按错误次数从高到低", contentX, y + 17 * u);
  y += (24 + 10) * u;
  y = drawShareWords(ctx, font, C, entries, contentX, y, u);
  y += 24 * u;
  paintShareCardFooter(ctx, font, C, contentX, y, u);
  return canvas;
}
/* 把画好的分享卡片交出去：触屏设备优先走系统分享（能直接存文件/
   发出去）；分享不可用时打开页面内的图片面板，长按图片保存；桌面端
   直接下载 PNG。与在线版同一套路。 */
function deliverShareImage(canvas, filename){
  if (!canvas.toBlob){ showToast("这台设备的浏览器不支持生成图片"); return; }
  canvas.toBlob(function(blob){
    if (!blob){ showToast("分享卡片生成失败，请重试"); return; }
    var coarsePointer = typeof window.matchMedia === "function" && window.matchMedia("(pointer: coarse)").matches;
    if (coarsePointer && typeof navigator.canShare === "function" && typeof File === "function"){
      var file = new File([blob], filename, { type: "image/png" });
      if (navigator.canShare({ files: [file] })){
        navigator.share({ files: [file], title: filename }).then(function(){
          showToast("分享卡片已生成");
        }).catch(function(err){
          /* 用户取消分享：什么都不做；分享失败才落到图片面板 */
          if (err && err.name === "AbortError") return;
          sharePanel = { url: URL.createObjectURL(blob), filename: filename };
          renderShare();
        });
        return;
      }
    }
    if (coarsePointer){
      sharePanel = { url: URL.createObjectURL(blob), filename: filename };
      renderShare();
      return;
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    showToast("分享卡片已下载");
  }, "image/png");
}
/* 只在点了「分享卡片」按钮时才生成图片。 */
function exportShareCard(mode){
  var data = buildShareData(mode);
  if (!data){ showToast("还没有练习记录，先练一轮再分享"); return; }
  var canvas;
  try { canvas = drawShareCard(data); }
  catch (e) { showToast("分享卡片生成失败，请重试"); return; }
  var now = new Date();
  function pad2(n){ return String(n).padStart(2, "0"); }
  /* 文件名带时分秒，同一天多次导出也不会重名。 */
  var filename = "练习分享卡片-" + data.modeLabel + "-" + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate()) + "-" + pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds()) + ".png";
  deliverShareImage(canvas, filename);
}
/* 历史错题卡片：当前模式的历史错题，错词按次数从高到低，没有轮次和
   正确率。只在点了历史错题页的「分享卡片」按钮时才生成。 */
function exportHistoryShareCard(mode){
  var words = sortedBookEntries(bookFor(mode, "history"), false).map(function(pair){
    var rec = pair[1];
    return { word: rec.word, ipa: rec.ipa, meaning: rec.meaning, count: rec.count };
  });
  if (!words.length){ showToast("历史错题是空的，还没有可分享的错词"); return; }
  var now = new Date();
  function pad2(n){ return String(n).padStart(2, "0"); }
  var modeLabel = mode === "flash" ? "英译中" : "中译英";
  var canvas;
  try {
    canvas = drawHistoryShareCard({
      modeLabel: modeLabel,
      dateText: now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日",
      words: words
    });
  } catch (e) { showToast("分享卡片生成失败，请重试"); return; }
  var filename = "历史错题卡片-" + modeLabel + "-" + now.getFullYear() + pad2(now.getMonth() + 1) + pad2(now.getDate()) + "-" + pad2(now.getHours()) + pad2(now.getMinutes()) + pad2(now.getSeconds()) + ".png";
  deliverShareImage(canvas, filename);
}

function replaceHistoryBook(mode, items){
  /* 保留每条记录自带的序号（原来的排序），没有序号的排在已有最大序号之后 */
  var used = {};
  var next = 0;
  Object.keys(items).forEach(function(k){ if (items[k].seq > 0) next = Math.max(next, items[k].seq); });
  Object.keys(items).forEach(function(k){
    var s = items[k].seq;
    if (!(s > 0) || used[s]){ next += 1; s = next; }
    used[s] = true;
    items[k].seq = s;
    if (s > bookSeq) bookSeq = s;
  });
  if (mode === "flash"){ fcHistoryBook = items; saveBook(FC_HIST_KEY, fcHistoryBook); }
  else { qzHistoryBook = items; saveBook(QZ_HIST_KEY, qzHistoryBook); }
}
function mergeHistoryBook(mode, items){
  var book = historyBook(mode);
  var seq = 0;
  Object.keys(book).forEach(function(k){ if (book[k].seq > seq) seq = book[k].seq; });
  var added = 0, merged = 0, skipped = 0;
  Object.keys(items).forEach(function(rawKey){
    var key = rawKey.toLowerCase();
    var inc = items[rawKey];
    var cur = book[key];
    if (cur){
      merged += 1;
      inc.reasons.forEach(function(r){ if (cur.reasons.indexOf(r) === -1) cur.reasons.push(r); });
      /* 按每条错次的编号取并集：已经有的不重复算，只有真正新的错次才让次数增加，合并后次数不会变少 */
      cur.events = materializeEvents(key, cur.count, cur.events, cur.lastTime || "");
      var seen = {};
      cur.events.forEach(function(e){ seen[e.id] = true; });
      (inc.events || []).forEach(function(e){
        if (seen[e.id]) skipped += 1;
        else { seen[e.id] = true; cur.events.push(e); }
      });
      cur.count = cur.events.length;
      if (!cur.ipa) cur.ipa = inc.ipa;
      if (new Date(inc.lastTime) > new Date(cur.lastTime)) cur.lastTime = inc.lastTime;
    } else {
      added += 1;
      seq += 1;
      book[key] = {
        word: inc.word, meaning: inc.meaning, ipa: inc.ipa,
        count: inc.count, reasons: inc.reasons.slice(), events: (inc.events || []).slice(),
        seq: seq, lastTime: inc.lastTime
      };
      if (seq > bookSeq) bookSeq = seq;
    }
  });
  if (mode === "flash") saveBook(FC_HIST_KEY, fcHistoryBook);
  else saveBook(QZ_HIST_KEY, qzHistoryBook);
  return { added: added, merged: merged, skipped: skipped };
}
/* 备份文本解析：先去掉可能混进来的 BOM 头和首尾空白（文件在聊天软件、
   备忘录之间转手保存时常会带上，JSON.parse 遇到 BOM 会直接失败）；
   粘贴进来的内容若被包了一层，截取第一个 { 到最后一个 } 再解析。 */
function parseBackupText(text){
  var t = String(text == null ? "" : text);
  if (t.charCodeAt(0) === 0xFEFF) t = t.slice(1);
  t = t.replace(/^\s+/, "").replace(/\s+$/, "");
  var s = t.indexOf("{"), e = t.lastIndexOf("}");
  if (s > 0 && e > s) t = t.slice(s, e + 1);
  return JSON.parse(t);
}
/* 备份识别：导出、文件导入、粘贴导入共用这一套规则（与在线版一致）。
   导出的是带时间戳、次数、每条错次编号的详细 JSON，识别时先按原样
   整体解析；内容经剪贴板、聊天软件、备忘录转手时可能被截断、引号
   被换成弯引号、或被转义，整体解析就会失败或只剩几个词——这时逐条
   抢救：把文本里每一条完整的单词记录单独抠出来解析，能认出的全认，
   时间戳、次数、错次编号都跟着记录一起进来。最后取识别出词数最多
   的结果，一个词都不丢。 */
function parseBackupBook(rawText){
  var raw = String(rawText == null ? "" : rawText);
  var candidates = [];
  function consider(data){
    var b = normalizeImportedBook(data);
    if (b) candidates.push(b);
  }
  /* 0) 内容被整体转义成一个 JSON 字符串（\"…\"）时，先解一层。 */
  var work = raw;
  try {
    var once = JSON.parse(raw.replace(/^\s+/, "").replace(/\s+$/, ""));
    if (typeof once === "string") work = once;
  } catch (e) { /* 不是整体字符串，继续下面的流程 */ }
  /* 1) 原样整体解析。 */
  var strictData = null;
  try { strictData = parseBackupText(work); } catch (e) { strictData = null; }
  if (typeof strictData === "string"){
    try { strictData = parseBackupText(strictData); } catch (e) { strictData = null; }
  }
  if (strictData) consider(strictData);
  /* 2) 修掉转手时常见的变形（弯引号、HTML 转义）后再整体解析。 */
  var repaired = work
    .replace(/[“”„]/g, "\"")
    .replace(/[‘’]/g, "'")
    .replace(/&quot;/g, "\"")
    .replace(/&#34;/g, "\"")
    .replace(/&amp;/g, "&");
  if (repaired !== raw){
    try { consider(parseBackupText(repaired)); } catch (e) { /* 落到逐条抢救 */ }
  }
  /* 3) 逐条抢救：扫描文本里每一个完整的 { … } 片段，能解析且带 word
        字段的就是一条单词记录。外层结构坏了、文本被截断时，完整的
        记录照样一条条认出来。 */
  var salvaged = {};
  for (var i = 0; i < repaired.length; i += 1){
    if (repaired.charAt(i) !== "{") continue;
    var depth = 0, inStr = false, escCh = false, end = -1;
    for (var j = i; j < repaired.length; j += 1){
      var c = repaired.charAt(j);
      if (inStr){
        if (escCh) escCh = false;
        else if (c === "\\") escCh = true;
        else if (c === "\"") inStr = false;
        continue;
      }
      if (c === "\"") inStr = true;
      else if (c === "{") depth += 1;
      else if (c === "}"){
        depth -= 1;
        if (depth === 0){ end = j; break; }
      }
    }
    if (end === -1) continue;
    try {
      var obj = JSON.parse(repaired.slice(i, end + 1));
      if (obj && typeof obj === "object" && !Array.isArray(obj)
          && typeof obj.word === "string" && obj.word.trim()){
        salvaged[obj.word.trim().toLowerCase()] = obj;
      }
    } catch (e) { /* 不是完整的 JSON 片段，跳过 */ }
  }
  if (Object.keys(salvaged).length) consider(salvaged);
  if (!candidates.length) return null;
  var best = candidates[0];
  candidates.forEach(function(b){
    if (Object.keys(b).length > Object.keys(best).length) best = b;
  });
  return best;
}
function applyImported(action, text){
  var imported = parseBackupBook(text);
  if (!imported){ showToast("读不出错题记录，请确认用的是导出的备份"); return false; }
  var inCount = Object.keys(imported).length;
  if (action === "import"){
    replaceHistoryBook(bookMode, imported);
    render();
    showToast("已导入 " + inCount + " 个词，替换了原来的历史错题");
  } else {
    var res = mergeHistoryBook(bookMode, imported);
    render();
    showToast(res.skipped > 0
      ? "合并完成：新增 " + res.added + " 个词，合并 " + res.merged + " 个词，其中 " + res.skipped + " 次是已有的记录，已跳过不重复计数"
      : "合并完成：新增 " + res.added + " 个词，合并 " + res.merged + " 个词");
  }
  return true;
}
function handleFileChosen(file){
  var action = ioAction;
  ioAction = null;
  if (!action || !file) return;
  var reader = new FileReader();
  reader.onload = function(){
    /* 与粘贴导入走同一个识别入口（applyImported → parseBackupBook） */
    if (!applyImported(action, reader.result)){
      showToast("这个文件读不出错题记录，请确认选的是导出的备份文件；选文件不行时可以试试「粘贴导入」");
    }
  };
  reader.onerror = function(){ showToast("文件读取失败，请重试，或试试「粘贴导入」"); };
  reader.readAsText(file);
}

  if (action === "import" && !pasteArmed){
    pasteArmed = true;
    var b = document.getElementById("paste-import-btn");
    if (b){ b.textContent = "再点一次确认替换"; b.className = "primary armed"; }
    showToast("导入会替换当前历史错题，确认就再点一次「导入（替换）」");
    return;
  }
  pasteArmed = false;
  var ok = applyImported(action, pasteText);

    showToast("这份内容读不出错题记录，请把备份文件的全部内容原样粘贴进来");
    return;
  }
  if (ok){
    pasteOpen = false;
    pasteText = "";
    renderPaste();
  }
}

/* 用某个模式的历史错题当词库，随机练一轮，走正常结算流程 */
function startHistoryPractice(mode){
  var hist = historyBook(mode);
  var pool = [];
  Object.keys(hist).forEach(function(key){
    var idx = wordIndexByKey[key];
    if (idx !== undefined) pool.push(idx);
  });
  if (!pool.length){ showToast("历史错题是空的，还没有可以练习的词"); return; }
  bookOpen = false;
  view = mode;
  if (mode === "flash") startFlashRound(pool, false);
  else startQuizRound(pool, false);
}
/* 用某个模式的本次错题当词库，随机练一轮，走正常结算流程（与历史错题练习同款） */
function startSessionPractice(mode){
  var sess = sessionBook(mode);
  var pool = [];
  Object.keys(sess).forEach(function(key){
    var idx = wordIndexByKey[key];
    if (idx !== undefined) pool.push(idx);
  });
  if (!pool.length){ showToast("本次错题是空的，还没有可以练习的词"); return; }
  bookOpen = false;
  view = mode;
  if (mode === "flash") startFlashRound(pool, false);
  else startQuizRound(pool, false);
}
function bookEntryAt(i){
  var pair = currentBookEntries[i];
  if (!pair) return { word: "", ipa: "", meaning: "" };
  var rec = pair[1];
  var idx = wordIndexByKey[pair[0]];
  return idx !== undefined ? WORDS[idx] : { word: rec.word, ipa: rec.ipa, meaning: rec.meaning };
}
function bookSpeak(i){ var e = bookEntryAt(i); if (e.word) speakWord(e.word, accent); }
function openWordCard(i){
  var pair = currentBookEntries[i];
  if (!pair) return;
  modalEntry = bookEntryAt(i);
  renderModal();
}
function closeWordCard(){ modalEntry = null; renderModal(); }
function modalSpeak(){ if (modalEntry) speakWord(modalEntry.word, accent); }
function modalSpeakForm(i){
  if (!modalEntry) return;
  var pairs = formIpaPairs(modalEntry, accent);
  if (pairs[i]){ speakSeq += 1; speakOne(pairs[i].form, accent); }
}

function actionRowHtml(fnName, mode){

function statsHtml(round, remaining){
  /* 左边换成词库进度：总数 / 已练 / 还剩 / 当前第几个。已练用实时数
     （已结算 + 当前这道已提交未点「下一个」的），提交了就算已练、
     还剩立刻减一；当前第几个 = 已结算数 + 1。remaining 参数不再用。 */
  var liveC = round.correct + (typeof qzFeedback !== "undefined" && qzFeedback && qzFeedback.kind === "correct" ? 1 : 0);
  var liveW = round.wrong + (typeof qzFeedback !== "undefined" && qzFeedback && qzFeedback.kind !== "correct" ? 1 : 0);
  var done = liveC + liveW;
  var h = '<div class="stats"><span aria-live="polite">词库 ' + round.total + ' 词 · 当前第 ' + (round.correct + round.wrong + 1) + ' 个 · 还剩 ' + (round.total - done) + ' · 已练 ' + done + '</span><span>正确 ' + round.correct + ' · 错误 ' + round.wrong;
  if (round.correct + round.wrong > 0) h += ' · 正确率 ' + rateText(round.correct, round.wrong);
  if (round.isReview) h += ' · 「不知道」练习轮';
  return h + '</span></div>';
}
/* 本轮实时统计（仅英译中闪卡）：fc.correct/wrong 是已点「下一个」结算过的数，
   当前这张卡的判定（fcJudged）还没结算。实时数 = 已结算 + 当前判定：
   点「正确」立刻 +1，切换成「不会/错误」时正确自动取消、错误 +1，
   反过来也一样；点「下一个」后判定折进结算数，总数不变。 */
function fcLiveCounts(){
  var c = fc.correct + (fcJudged === "correct" ? 1 : 0);
  var w = fc.wrong + (fcJudged === "wrong" ? 1 : 0);
  return { correct: c, wrong: w, judged: c + w };
}
function flashStatsHtml(){
  var live = fcLiveCounts();
  var rate = rateText(live.correct, live.wrong);
  var done = live.judged;
  var pos = fc.correct + fc.wrong + 1;
  return '<div class="stats" aria-live="polite" aria-label="本轮词库进度：词库 ' + fc.total + ' 词，当前第 ' + pos + ' 个，还剩 ' + (fc.total - done) + '，已练 ' + done + '；正确 ' + live.correct + '，错误 ' + live.wrong + '，正确率 ' + rate + '">'
    + '<span>词库 ' + fc.total + ' 词 · 当前第 ' + pos + ' 个 · 还剩 ' + (fc.total - done) + ' · 已练 ' + done + '</span>'
    + '<span>正确 ' + live.correct + ' · 错误 ' + live.wrong + ' · 正确率 ' + rate + '</span></div>';
}

/* ================= pile panel ================= */
function pilePanelHtml(mode){
  var panel = mode === "flash" ? fcPanel : qzPanel;
  var round = mode === "flash" ? fc : qz;
  var pile = mode === "flash" ? fcPile : qzPile;
  if (!panel.open) return "";

  var title = (mode === "flash" ? "英译中" : "中译英") + " · 本轮正确率";
  var h = '<div class="overlay" role="dialog" aria-modal="true" aria-label="' + title + '" onclick="pilePanelClose(\'' + mode + '\')">'
    + '<div class="sheet" onclick="event.stopPropagation()">'
    + '<h3>' + title + '</h3>'
    + '<p class="rate">' + rateText(r.correct, r.wrong) + '</p>'
    + '<p class="info">答对 ' + r.correct + ' · 不会 ' + r.wrong + ' · 本轮共 ' + r.total + ' 个词<br>不知道的词 ' + pile.length + ' 个</p>'
    + '<div class="btns">';
  if (pile.length > 0){
    /* 刚练完的这一轮本身就是「不知道」练习轮时，再练就是接着练，
       按钮写「继续练习」；从普通轮次第一次练才是「开始练习」。 */
    var practiceLabel = round.isReview ? "继续练习" : "开始练习";
    h += '<button type="button" class="btn-accent" aria-label="' + practiceLabel + '不知道的词" onclick="pilePanelStartPractice(\'' + mode + '\')">' + practiceLabel + '</button>';
  }
  if (round.status === "finished")
    h += '<button type="button" class="btn-dark" aria-label="完成" onclick="pilePanelFinish(\'' + mode + '\')">完成</button>';
  else
    h += '<button type="button" class="btn-ghost" aria-label="继续这一轮" onclick="pilePanelClose(\'' + mode + '\')">继续这一轮</button>';
  h += '<button type="button" class="btn-ghost" aria-label="分享卡片" onclick="exportShareCard(\'' + mode + '\')">' + SHARE_ICON + '分享卡片</button>';
  return h + '</div></div></div>';
}

    + '<p class="word serif">' + esc(modalEntry.word) + '</p>'
    + ipaHtml(modalEntry.ipa, accent)
    + '<button type="button" class="btn-speak" aria-label="听发音" onclick="modalSpeak()">🔊 听发音</button>'
    + formChipsHtml(modalEntry, accent, "modalSpeakForm")
    + '<p class="meaning">' + esc(modalEntry.meaning) + '</p>'
    + '</div></div>';
}

/* ================= main render ================= */
function render(){
  var app = document.getElementById("app");
  var h = '<main class="wrap">'
    + '<div class="topbar"><p class="cnt" style="margin:0">共 <strong>777</strong> 个词 · the — statement</p>'
    + (((view === "flash" && fc.status === "active") || (view === "quiz" && qz.status === "active"))
        ? ''
        : '<div class="accent-wrap"><span class="lbl">发音：</span>' + accentHtml("发音口音切换") + '</div>')
    + '</div>'
    + '<div class="tabs" role="tablist" aria-label="练习模式">'
    + '<button type="button" role="tab" aria-selected="' + (view === "flash") + '" class="' + (view === "flash" ? "on" : "") + '" onclick="setView(\'flash\')">英译中闪卡</button>'
    + '<button type="button" role="tab" aria-selected="' + (view === "quiz") + '" class="' + (view === "quiz" ? "on" : "") + '" onclick="setView(\'quiz\')">中译英拼写</button></div>'
    + (view === "flash"
        ? '<section aria-label="英译中闪卡">' + flashHtml() + '</section>'
        : '<section aria-label="中译英拼写">' + quizHtml() + '</section>')
    + '</main>';
  /* keep whatever the user is typing in the quiz input across re-renders */
  var activeEl = document.activeElement;
  var hadFocus = activeEl && activeEl.id === "quiz-answer";
  if (hadFocus) qzInput = activeEl.value;
  app.innerHTML = h;
  if (hadFocus){
    var inp = document.getElementById("quiz-answer");
    if (inp && !inp.disabled){
      inp.focus();
      try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
    }
  }
  /* pile pill */
  var pillSlot = document.getElementById("pill-slot");
  var round = view === "flash" ? fc : qz;
  var pile = view === "flash" ? fcPile : qzPile;
  if (round.status === "active"){
    pillSlot.innerHTML = '<button type="button" class="pill" aria-label="不知道的词，' + pile.length + ' 个，打开查看本轮正确率" onclick="openPilePanel(\'' + view + '\')">不知道的词<strong>' + pile.length + '</strong></button>';
  } else {
    pillSlot.innerHTML = "";
  }
  /* pile panel */
  document.getElementById("panel-slot").innerHTML = pilePanelHtml("flash") + pilePanelHtml("quiz");
  renderBook();
  renderModal();
}
function setView(v){ view = v; render(); }

document.getElementById("io-file").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (f) handleFileChosen(f);
});
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape" && sharePanel) closeSharePanel();
  else if (ev.key === "Escape" && clearConfirm) closeClearConfirm();
  else if (ev.key === "Escape" && pasteOpen) closePasteImport();
  else if (ev.key === "Escape" && modalEntry) closeWordCard();
});
render();

</script>
</body>
</html>
